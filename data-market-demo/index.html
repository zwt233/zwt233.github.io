function licenseModal(id){const l=lic(id);if(!l)return;const vs=state.versions.filter(v=>v.licenseId===id);modal('授权记录 · '+esc(l.id),`<span class="tag blue">${esc(l.name)} · 模拟记录</span>${licenseFacts(l)}<p class="sm">${l.kind==='sample'?'试样只能做适配验证，不能训练或再售。':l.rights.resell?'加工后销售受本许可范围约束；不允许原样转售他人源数据。':'允许约定的内部使用，不允许将原数据或衍生数据包转售。'}</p><p class="sm muted">${l.royalty?'作者保留原商品销售权；一次性授权费 ¥3,000，后续按净销售额分成 20%，不抵扣前期费用。':'来源追溯与商业许可分别记录；完成加工不会扩大原许可范围。'}</p><h3>绑定版本</h3>${vs.map(v=>`<div class="activity"><div>${esc(vname(v))}<div class="code-id">${v.id}</div></div><button class="small" data-version="${v.id}">查看版本</button></div>`).join('')}`,`<button data-action="close-modal">关闭</button><button class="primary" data-download-license="${l.id}">下载授权摘要</button>`)}

function productModal(){const p=products.find(p=>p.id===state.selectedProduct);const sample=state.purchaseType==='sample';const hasSample=state.orders.some(o=>o.productId===p.id&&o.kind==='sample'&&!isRefunded(o.id));const due=sample?p.sample:p.price-(hasSample?p.sample:0);const l={author:p.type==='官方加工'?'数作官方工作室':'示例作者 · '+p.name.slice(0,4),holder:'购买本许可的组织',scope:'中国大陆 · 本组织 · 非独占',expires:sample?'2026-11-20':'2027-10-21',evidence:'作者来源声明与示例许可条款',kind:sample?'sample':'full',rights:{process:true,train:!sample,resell:false}};modal(p.name,`<div class="badge-row"><span class="tag ${badge(p.type)}">${p.type}</span><span class="tag">商品版本 1.0</span><span class="tag">${p.quality}</span></div><p class="sm muted" style="margin-top:15px">${esc(p.text)}</p><div class="sample"><b>公开样例 · 作者授权展示</b><p class="sm" style="margin-top:8px">核对模拟报表：明细合计 1,250 元，报表总计 1,200 元。参考输出：差额 50 元，返回需复核字段。</p></div><h3 style="margin-top:20px">选择商品许可</h3><div class="license-grid"><button class="license-option ${sample?'active':''}" data-buykind="sample"><b>付费试样 ${money(p.sample)}</b><p class="tiny muted">仅适配验证 · 30 日内升级可抵扣</p></button><button class="license-option ${!sample?'active':''}" data-buykind="full"><b>内部使用 ${money(p.price)}</b><p class="tiny muted">加工、训练、评测 · 不允许再售</p></button></div>${licenseFacts(l)}<p class="sm muted">交付锁定商品版本与许可。官方加工再售需另签衍生销售许可；样例展示不授予平台全量数据使用权。</p><label class="checkline"><input id="buy-confirm" type="checkbox">我已确认用途、期限、交付版本和限制。此操作仅生成模拟订单。</label><div class="flex between"><span class="sm muted">${!sample&&hasSample?'已抵扣试购款 '+money(p.sample):'示例报价 · 不支付真实费用'}</span><b class="price">${money(due)}</b></div>`,`<button data-action="close-modal">取消</button><button class="primary" data-action="buy">模拟购买</button>`)}
function buy(){if(!$('#buy-confirm')?.checked)return toast('请先确认商品许可');const p=products.find(p=>p.id===state.selectedProduct),kind=state.purchaseType;const existing=state.orders.filter(o=>o.productId===p.id&&!isRefunded(o.id));if(existing.some(o=>o.kind===kind||o.kind==='full'))return toast('已有此许可或完整包，无需重复购买');const l=addLicense({name:kind==='sample'?'试样许可':'内部使用许可',author:p.type==='官方加工'?'数作官方工作室':'示例专业作者',holder:'示例采购组织',kind,expires:kind==='sample'?'2026-11-20':'2027-10-21',rights:{process:true,train:kind==='full',resell:false}});const v=addVersion({name:p.name+(kind==='sample'?' · 试样':''),root:'product-'+p.id,version:'1.0',rows:makeRaw(),licenseId:l.id,origin:kind,quality:p.quality});const paid=kind==='sample'?p.sample:p.price-(existing.some(o=>o.kind==='sample')?p.sample:0);state.orders.push(freeze({id:next('O'),name:p.name,productId:p.id,kind,paid,licenseId:l.id,versionId:v.id}));state.sourceId=v.id;state.cloudVersionId=v.id;state.outputId=null;state.plan=null;state.workspaceTab='licenses';$('#modal').close();navigate('workspace');toast('模拟订单、许可及交付版本已关联；载入内置合成数据')}
function studio(){const v=current(),cost=processingCost();return `<div class="page-head"><div class="eyebrow">DataFlow 工场</div><div class="flex between wrap"><h1>把加工过程，留在每个新版本里</h1><button class="small" data-worktab="tasks">查看任务中心 →</button></div><p class="muted">自然语言生成计划，确认后创建任务。源版本保留，输出可追溯、可复用。</p></div>${state.feedback?`<div class="notice feedback"><b>来自评测 ${esc(state.feedback.evalId)} 的建议：</b>${esc(state.feedback.text)}<br>只带回问题类型，不把独立评测题目或答案加入训练。<button class="small ghost" data-action="clear-feedback">清除建议</button></div>`:''}<div class="studio-layout"><div class="stack"><section class="panel input-stack"><div><label class="field" for="source">输入数据版本</label><select id="source" class="version-select">${state.versions.map(x=>`<option value="${x.id}" ${x.id===state.sourceId?'selected':''}>${x.id} · ${esc(vname(x))}</option>`).join('')}<option value="upload" ${state.sourceId==='upload'?'selected':''}>导入本地 JSON / JSONL 文件</option></select><p class="field-desc">已登记版本不会被覆盖，修改会产生新版本。</p></div>${state.sourceId==='upload'?uploadUI():v?`<div class="notice"><b>${esc(lic(v.licenseId).name)}</b><div class="scope-text">${can(v,'train')?'可内部训练':'不可训练'} · ${can(v,'resell')?'可按约衍生销售':'不可再售'}</div><button class="small ghost" data-license="${v.licenseId}">查看 ${v.licenseId} →</button></div>`:''}<div><label class="field" for="instruction">用自然语言描述目标</label><textarea id="instruction" rows="5">${esc(state.instruction)}</textarea></div><div class="flex wrap"><button class="small" data-prompt="clean">清洗去重</button><button class="small" data-prompt="full">清洗 + 改写 + 配比</button></div><button class="primary" data-action="plan">生成处理计划</button><p class="tiny muted">Demo 按关键词解析，改写使用模板；正式版接入 DataFlow，不把技术检查等同于专业质检。</p></section><section class="panel"><h3>本次费用预览</h3><div class="costline"><span>加工服务费</span><b>${money(cost.service)}</b></div><div class="costline"><span>模型 / 资源估算</span><b>${money(cost.resource)}</b></div><div class="costline"><b>预计合计</b><b>${money(cost.total)}</b></div><p class="tiny muted">运行后记录模拟账单；无真实收费。</p></section></div><div class="stack"><section class="panel" id="pipeline-panel"><div class="section-title"><div><h2>可检查的处理计划</h2><span class="sm muted">${esc(vname(v))}</span></div><span class="tag ${state.plan?'green':''}">${state.plan?'计划已生成':'等待生成'}</span></div><div class="pipeline">${planSteps()}</div><div class="notice">来源、授权与任务各自留痕。新版本只保留原许可允许的用途，不因加工而获得额外销售权。</div><div class="actionline"><button data-action="dry-run" ${state.plan?'':'disabled'}>预览前 3 条</button><button class="teal" data-action="run" ${state.plan?'':'disabled'}>模拟确认费用并运行</button></div></section><section class="panel" id="result-panel">${processingResult()}</section></div></div>`}
function uploadUI(){const u=state.uploadDraft;return `<div><label class="field" for="upload">本地文件 ≤ 1 MB / 5,000 条</label><input type="file" id="upload" accept=".json,.jsonl"><p class="tiny muted">字段 question、answer、domain。文件仅在浏览器内存中处理。</p>${u?`<p class="sm">已读取：${esc(u.name)} · ${u.rows.length} 条</p><label class="checkline"><input id="upload-process" type="checkbox" ${u.process?'checked':''}>我有权处理该文件。</label><label class="checkline"><input id="upload-train" type="checkbox" ${u.train?'checked':''}>我另有内部训练与应用许可。</label><label class="checkline"><input id="upload-resell" type="checkbox" ${u.resell?'checked':''}>我另有加工后商业分销许可，可提供证明。</label><button class="small teal" data-action="register-upload">登记源版本与权利声明</button><p class="tiny muted">声明不等于核验，真实商品发布前需审核权利依据。</p>`:''}</div>`}
async function upload(e){const file=e.target.files[0];if(!file)return;if(file.size>1024*1024)return toast('文件不得超过 1 MB');try{const text=await file.text();let rows;try{rows=JSON.parse(text)}catch{rows=text.split(/\r?\n/).filter(x=>x.trim()).map(x=>JSON.parse(x))}if(!Array.isArray(rows)||!rows.length||rows.length>5000||rows.some(x=>!x||typeof x!=='object'||Array.isArray(x)||!('question'in x)||!('answer'in x)))throw Error('需要含 question、answer 的非空数组或 JSONL，最多 5,000 条');state.uploadDraft={name:file.name,process:false,train:false,resell:false,rows:rows.map((x,i)=>({id:String(x.id||'local-'+i),question:String(x.question??''),answer:String(x.answer??''),domain:String(x.domain||'未分类')}))};render();toast('文件已本地读取，登记权利声明后可加工')}catch(err){toast('读取失败：'+err.message)}}
function registerUpload(){const u=state.uploadDraft;if(!u?.process)return toast('请先读取文件并确认加工权利');const l=addLicense({name:'本地文件权利声明',kind:'upload',author:'本地文件提供者',holder:'当前工作室',evidence:'作者自行声明 · 未专业核验',expires:'按权利依据约定',rights:{process:u.process,train:u.train,resell:u.resell}});const v=addVersion({name:u.name,root:'upload-'+l.id,version:'1.0',rows:u.rows,licenseId:l.id,origin:'upload'});state.sourceId=v.id;state.uploadDraft=null;state.plan=null;state.outputId=null;render();toast('已登记独立源版本 '+v.id)}
function processingCost(){const n=current()?.rows.length||0,service=Math.max(10,Math.ceil(n/1000)*5),resource=state.plan?.rewrite?Math.max(2,Math.ceil(n/1000)*2):0;return {service,resource,total:service+resource}}
function generatePlan(){if(!current())return toast('请先登记或选择一个数据版本');const text=$('#instruction').value;state.instruction=text;const a=text.match(/办公\s*(\d{1,3})\s*%/),b=text.match(/分析\s*(\d{1,3})\s*%/);const ratio=a?+a[1]:b?100-Number(b[1]):70;if(ratio<0||ratio>100||a&&b&&Number(a[1])+Number(b[1])!==100)return toast('办公与分析配比需合计 100%');const neg=k=>new RegExp('(不|不要|无需)'+k).test(text);const plan={filter:/过滤|清洗|空/.test(text)&&!neg('过滤'),dedup:/去重|重复/.test(text)&&!neg('去重'),rewrite:/改写|指令/.test(text)&&!neg('改写'),mix:/配比|混合|办公.*%/.test(text)&&!neg('配比'),ratio};if(!['filter','dedup','rewrite','mix'].some(k=>plan[k]))return toast('本 Demo 支持过滤、去重、改写和配比');state.plan=plan;state.outputId=null;render();toast('已生成可检查的处理计划')}
function processRows(raw,plan){let rows=copy(raw),input=rows.length,filtered=0,duplicates=0,unselected=0;if(plan.filter){const n=rows.length;rows=rows.filter(x=>String(x.question).trim()&&String(x.answer).trim());filtered=n-rows.length}if(plan.dedup){const seen=new Set;rows=rows.filter(x=>{const key=String(x.question).trim()+'\u0000'+String(x.answer).trim();if(seen.has(key)){duplicates++;return false}seen.add(key);return true})}if(plan.rewrite)rows=rows.map(x=>({...x,original_question:x.original_question||x.question,question:'请完成以下专业任务：'+String(x.original_question||x.question).trim().replace(/[？?。]$/,'')+'。'}));if(plan.mix){const office=rows.filter(x=>x.domain==='办公'),analysis=rows.filter(x=>x.domain==='分析'),n=Math.min(10,rows.length),a=Math.round(n*plan.ratio/100),picked=[...office.slice(0,a),...analysis.slice(0,n-a)];unselected=rows.length-picked.length;rows=picked}return {rows,input,filtered,duplicates,unselected,office:rows.filter(x=>x.domain==='办公').length,analysis:rows.filter(x=>x.domain==='分析').length}}
function addTask(data){const t={id:next('T'),created:new Date().toLocaleTimeString('zh-CN'),status:'running',progress:0,billed:null,logs:[],...copy(data)};state.tasks.push(t);return t}
function runProcessing(preview=false){const input=current();if(!input||!state.plan)return toast('请先选择数据并生成计划');if(!can(input,'process'))return toast('该版本没有加工许可');const result=processRows(input.rows,state.plan);if(preview){modal('样例试跑 · 不产生版本或费用',`<div class="sample"><code>${esc(JSON.stringify(result.rows.slice(0,3),null,2))}</code></div><p class="sm muted" style="margin-top:12px">预估输出 ${result.rows.length} 条。配比最多抽取 10 条，类别不足不复制补齐。</p>`,`<button class="primary" data-action="close-modal">返回计划</button>`);return}const c=processingCost();const t=addTask({type:'processing',inputVersionId:input.id,licenseId:input.licenseId,estimate:c.total,plan:state.plan,feedbackEvalId:state.feedback?.evalId||null,logs:[`锁定 ${input.id} / ${input.version} 与许可 ${input.licenseId}`,`过滤 ${result.filtered} 条；去重 ${result.duplicates} 条；配比未选 ${result.unselected} 条`]});if(!result.rows.length){t.status='failed';t.billed=0;t.logs.push('输出为空，未生成新版本；模拟费用为 0');render();toast('处理失败：无可用样本。失败记录已进入任务中心');return}const n=state.versions.filter(v=>v.root===input.root&&v.parentId).length+1;const v=addVersion({name:input.name.replace(/ · 增强版$/,'')+' · 增强版',root:input.root,version:'1.'+n,parentId:input.id,taskId:t.id,licenseId:input.licenseId,origin:input.origin,rows:result.rows,stats:result,plan:state.plan,feedbackEvalId:t.feedbackEvalId});t.status='completed';t.progress=100;t.billed=c.total;t.outputVersionId=v.id;t.logs.push(`生成只读结果 ${v.id} / v${v.version}，源版本保持不变`);state.outputId=v.id;state.cloudVersionId=v.id;render();toast('已生成 '+v.id+'，加工任务和模拟费用已记录')}
function processingResult(){const v=output();if(!v)return `<h2>处理结果</h2><p class="muted sm">运行后生成新的只读版本，关联源数据、授权与处理任务。</p><div class="sample"><h3>输入样例</h3><code>${esc(JSON.stringify(current()?.rows[0]||{},null,2))}</code></div>`;const s=v.stats;return `<div class="section-title"><div><h2>新版本已生成</h2><span class="code-id">${v.id} · v${v.version} · ${v.taskId}</span></div><span class="tag green">只读快照</span></div><div class="mini-kpis"><div><b>${s.input}</b><small>输入条数</small></div><div><b>${v.rows.length}</b><small>输出条数</small></div><div><b>${s.office} / ${s.analysis}</b><small>办公 / 分析</small></div></div><p class="sm muted" style="margin-top:12px">过滤 ${s.filtered} 条 · 去重 ${s.duplicates} 条 · 配比未选 ${s.unselected} 条</p><div class="badge-row"><button class="small" data-version="${v.id}">版本与溯源</button><button class="small" data-license="${v.licenseId}">${lic(v.licenseId).name}</button><button class="small" data-task="${v.taskId}">任务记录</button></div><div class="actionline"><button data-download-version="${v.id}">下载 JSONL</button><button data-publish="${v.id}">发布商品</button><button class="primary" data-train-version="${v.id}">训练 / Agent →</button></div><p class="scope-text">${can(v,'train')?'允许内部训练':'不可用于训练'} · ${can(v,'resell')?'可在许可范围内衍生销售':'当前不能直接再销售'}</p>`}
function ancestors(v){const a=[],seen=new Set;while(v&&!seen.has(v.id)){a.unshift(v);seen.add(v.id);v=ver(v.parentId)}return a}
function lineage(v){return `<div class="lineage">${ancestors(v).map((x,i)=>`${i?`<div class="lineage-join">${x.taskId}<br>加工 →</div>`:''}<div class="lineage-node ${x.id===v.id?'current':''}"><span class="code-id">${x.id} · v${x.version}</span><strong>${esc(x.name)}</strong><span class="tiny muted">${x.rows.length} 条 · ${x.parentId?'衍生版本':'源版本'}</span><br><button class="small" data-version="${x.id}">查看版本</button></div>`).join('')}</div>`}
function versionModal(id){const v=ver(id);if(!v)return;const related=state.tasks.filter(t=>t.inputVersionId===v.id||t.outputVersionId===v.id),children=state.versions.filter(x=>x.parentId===v.id);modal('数据版本与溯源',`<div class="section-title"><div><h2>${esc(vname(v))}</h2><span class="code-id">${v.id}</span></div><span class="tag green">固定快照 · 不覆盖</span></div>${lineage(v)}<div class="notice">关联许可 ${v.licenseId} · ${esc(lic(v.licenseId).name)}。${can(v,'resell')?'可在授权范围内销售衍生商品。':'无衍生销售权，来源可追溯不代表可转售。'} <button class="small ghost" data-license="${v.licenseId}">查看授权</button></div>${v.feedbackEvalId?`<p class="sm" style="margin-top:14px">本次加工参考了 <button class="plain-link" data-task="${v.feedbackEvalId}">${v.feedbackEvalId} 的问题类型</button>，未加入独立评测题目。</p>`:''}<h3 style="margin-top:20px">关联任务</h3>${related.length?related.map(t=>`<div class="activity"><div><b>${typeName(t.type)} ${t.id}</b><div class="tiny muted">输入 ${t.inputVersionId} ${t.outputVersionId?'→ '+t.outputVersionId:''} ${t.outputModelId?'→ '+t.outputModelId:''}</div></div><button class="small" data-task="${t.id}">${statusName(t.status)} · 详情</button></div>`).join(''):'<p class="sm muted">尚无使用此版本的任务。</p>'}${children.length?`<h3 style="margin-top:18px">下游版本</h3><div class="badge-row">${children.map(x=>`<button class="small" data-version="${x.id}">${x.id} / v${x.version}</button>`).join('')}</div>`:''}<details><summary>查看数据样例与处理配方</summary><div class="sample" style="margin-top:10px"><code>${esc(JSON.stringify({sample:v.rows.slice(0,2),plan:v.plan||null},null,2))}</code></div></details>`,`<button data-download-version="${v.id}">下载数据</button><button data-publish="${v.id}">提交商品</button><button data-process-version="${v.id}">基于此版本加工</button><button class="primary" data-train-version="${v.id}">训练 / Agent</button>`)}
function official(){return `<section class="official-hero"><div class="eyebrow">作者共创 · 合作增值</div><h1>先约定授权，再加工和销售</h1><p class="muted">由真实采购需求发现候选商品。作者明确许可后，平台加工、专业质检并按约分账。</p><div class="license-step">${['需求信号','单独授权','加工与质检','衍生销售'].map((x,i)=>`<div class="${i===0||state.officialAccepted&&i===1?'done':''}">0${i+1}　${x}</div>`).join('')}</div></section><section class="panel"><div class="official-card"><div><span class="tag blue">第三方作者</span><h2 style="margin-top:12px">中文表格核对与分析任务</h2><p class="sm muted">最近 30 天：48 笔购买、9 家独立买方、18 次加工需求（均为示例）</p><p class="sm">补充难度分层、统一指令、专业抽检，并保留源版本与作者分成记录。</p></div><div class="right"><span class="tag ${state.officialAccepted?'green':'amber'}">${state.officialAccepted?'授权已记录 · 模拟':state.offer==='sent'?'待作者确认':'待合作'}</span><div style="margin-top:16px">${state.officialAccepted?'<button class="teal" data-action="official-process">带授权进入加工 →</button>':state.offer==='sent'?'<button class="teal" data-action="author-review">模拟作者查看并确认</button>':'<button class="primary" data-action="official-offer">发起授权采购</button>'}</div></div></div></section><div class="row section"><section class="panel"><h2>可讨论的合作条件</h2><div class="costline"><span>一次性授权费</span><b>¥3,000</b></div><div class="costline"><span>作者持续分成</span><b>净销售额 × 20%</b></div><div class="costline"><span>期限与范围</span><b>非独占 · 12 个月</b></div><p class="sm muted" style="margin-top:14px">作者保留原商品销售权。平台获约定的加工、内部训练与评测、衍生分销许可，不得原样转售。</p><p class="tiny muted">净销售额按实际成交价扣税款和退款，折扣不重复扣减；不扣运营和加工成本，不抵扣前期授权费。</p>${state.officialAccepted?`<button class="small" data-license="${ver(state.officialVersionId).licenseId}">查看授权记录与绑定版本</button>`:''}</section><section class="panel"><h2>商品与收益都可追溯</h2><p class="sm">源数据 → 加工任务 → 衍生版本 → 官方商品。每个发布版本独立关联许可和分成规则。</p><p class="sm muted">第三方样例展示不授予平台全量使用权。官方商品须完成专业质检；普通第三方加工只展示技术处理记录。</p><div class="notice">发布时明确授权方、范围、期限与来源。销售资格与来源记录分别审核。</div></section></div>`}
function acceptOfficial(){if(!$('#author-consent')?.checked)return toast('需由模拟作者确认授权范围');if(state.officialAccepted)return;const l=addLicense({name:'官方衍生销售许可',author:'示例表格任务作者',holder:'数作官方工作室',kind:'official',rights:{process:true,train:true,resell:true},evidence:'双方接受的衍生授权条款 · 模拟',royalty:20});const v=addVersion({name:'官方获授权表格任务',version:'1.0',root:'product-sheet',rows:makeRaw(),licenseId:l.id,origin:'official'});state.orders.push(freeze({id:next('O'),name:v.name,kind:'official',paid:3000,licenseId:l.id,versionId:v.id,productId:'sheet-official'}));state.offer='accepted';state.officialAccepted=true;state.officialVersionId=v.id;$('#modal').close();render();toast('已登记模拟采购订单、授权和源版本')}
function publishVersion(id){const v=ver(id);if(!v)return;if(!can(v,'resell'))return modal('当前许可不支持再销售',`<p>此版本未取得衍生销售许可。加工与溯源记录不会扩大商业使用范围。</p><button class="small" data-license="${v.licenseId}">查看原许可 ${v.licenseId}</button>`,`<button data-action="close-modal">返回</button><button class="primary" data-action="go-official">官方合作授权</button>`);if(state.published.some(p=>p.versionId===id))return toast('该版本已有发布记录，可加工新版本后再提交');state.publishingId=id;modal('发布固定版本商品',`<label class="field">商品名称</label><input id="pub-title" value="${esc(v.name)}"><div class="form-grid" style="margin-top:16px"><div><label class="field">非独占内部使用许可价格（元）</label><input id="pub-price" type="number" min="1" value="${v.origin==='official'?10000:2000}"></div><div><label class="field">固定交付版本</label><input readonly value="${v.id} / v${v.version}"></div></div><p class="sm muted" style="margin-top:15px">来源许可 ${v.licenseId}；买家获得内部使用许可，不获得再销售权。${lic(v.licenseId).royalty?'保留原作者署名，按净销售额记录 20% 分成。':'作者保留合法权利；平台抽佣示例 10%。'}</p><label class="checkline"><input id="pub-rights" type="checkbox">确认商业分销权及源材料证明与当前版本一致。</label>${(v.origin==='official'||v.origin==='trace')?'<label class="checkline"><input id="pub-qc" type="checkbox">模拟确认专业质检报告覆盖本版本。</label>':'<p class="tiny muted">提交后进入权利准入审核；第三方商品不自动获得官方专业质检标识。</p>'}`,`<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-publish">提交模拟发布</button>`)}
function confirmPublish(){const v=ver(state.publishingId);if(!v||!can(v,'resell'))return toast('无有效衍生销售许可');if(!$('#pub-rights')?.checked)return toast('请确认商业分销权与权利依据');if((v.origin==='official'||v.origin==='trace')&&!$('#pub-qc')?.checked)return toast('官方商品需完成本版本专业质检');const price=Number($('#pub-price').value),name=$('#pub-title').value.trim();if(!name||!Number.isFinite(price)||price<=0)return toast('请填写有效名称和价格');state.published.push(freeze({id:next('P'),name,price,versionId:v.id,licenseId:v.licenseId,royalty:lic(v.licenseId).royalty,status:v.origin==='official'?'已发布 · 模拟':'待准入审核 · 模拟'}));$('#modal').close();state.workspaceTab='versions';navigate('workspace');toast('发布记录已绑定固定版本与源授权')}
function cloudEstimate(){const agent=state.cloudMode==='agent',resource=agent?18:state.hours*state.gpus*12,service=agent?12:20,evaluation=agent?6:8;return {resource,service,evaluation,total:resource+service+evaluation}}
function evalSet(id){const e=evaluationSets.find(e=>e.id===id);if(e)return {...e,permitted:true};const v=ver(id);return v?{id:v.id,name:v.name,version:v.version,count:v.rows.length,root:v.root,permitted:can(v,'train')}:null}
function activeCloud(){return state.tasks.find(t=>t.status==='running'&&['training','agent','evaluation'].includes(t.type))}
function cloud(){const v=ver(state.cloudVersionId),c=cloudEstimate(),busy=!!activeCloud();return `<div class="page-head"><div class="eyebrow">模型与 Agent</div><div class="flex between wrap"><h1>训练有输入，评测有依据</h1><button class="small" data-worktab="tasks">任务中心 →</button></div><p class="muted">锁定数据版本、许可与独立评测集。构建和评测分别记录，结果始终对应原任务。</p></div><div class="cloud-layout"><section class="panel"><h2>选择目标</h2><div class="row"><button class="preset ${state.cloudMode==='sft'?'active':''}" data-mode="sft" ${busy?'disabled':''}><b>垂类模型微调</b><p>SFT / LoRA · 兼容 7B 示例模板</p></button><button class="preset ${state.cloudMode==='agent'?'active':''}" data-mode="agent" ${busy?'disabled':''}><b>知识库 Agent</b><p>RAG 与工具编排 · 不训练模型参数</p></button></div><hr><div class="form-grid"><div><label class="field" for="cloud-version">训练 / 应用数据</label><select id="cloud-version" ${busy?'disabled':''}>${state.versions.map(x=>`<option value="${x.id}" ${x.id===state.cloudVersionId?'selected':''}>${x.id} · ${esc(vname(x))}</option>`).join('')}</select><button class="plain-link tiny" style="margin-top:8px" data-license="${v?.licenseId}">查看输入授权 ${v?.licenseId||''}</button></div><div><label class="field" for="eval-set">独立评测集与固定版本</label><select id="eval-set" ${busy?'disabled':''}>${evaluationSets.map(e=>`<option value="${e.id}" ${state.evalSetId===e.id?'selected':''}>${e.name} v${e.version} · ${e.count} 条示例</option>`).join('')}<optgroup label="工作区数据（需独立来源）">${state.versions.map(x=>`<option value="${x.id}" ${state.evalSetId===x.id?'selected':''}>${x.id} · ${esc(vname(x))}</option>`).join('')}</optgroup></select><p class="field-desc">同一数据或同源衍生版本不可兼作评测集；正式版还需内容重合检查。</p></div><div><label class="field">基础模型 / 模板</label><input readonly value="${state.cloudMode==='sft'?'兼容 7B 模型 · LoRA 模板':'办公知识库 · 检索与表格工具'}"></div><div><label class="field" for="budget">构建 + 评测预算上限（元）</label><input type="number" id="budget" value="${state.budget}" min="1" ${busy?'disabled':''}></div>${state.cloudMode==='sft'?`<div><label class="field" for="hours">GPU 时长：<span id="hours-label">${state.hours}</span> 小时</label><input type="range" id="hours" value="${state.hours}" min="1" max="12" ${busy?'disabled':''}></div><div><label class="field" for="gpus">GPU 数量</label><select id="gpus" ${busy?'disabled':''}><option value="1" ${state.gpus===1?'selected':''}>1 张 · 示例规格</option><option value="2" ${state.gpus===2?'selected':''}>2 张 · 示例规格</option></select></div>`:''}</div><p class="tiny muted">资源提供方：云合作方 A（待接入）。当前只演示流程，不调用云服务。</p><div class="checks"><label class="checkline"><input id="training-rights" type="checkbox" ${state.cloudRights?'checked':''} ${busy?'disabled':''}>已核对数据与基础模型许可，以及资源方的处理范围。</label><label class="checkline"><input id="eval-separate" type="checkbox" ${state.evalConfirm?'checked':''} ${busy?'disabled':''}>确认独立评测集；构建完成后按本预算自动执行一次评测。</label></div><div id="cloud-error" class="error" role="alert"></div><div class="actionline"><button data-action="download-recipe">下载任务配置</button><button class="primary" data-action="start-cloud" ${busy?'disabled':''}>模拟构建并评测</button></div></section><div class="stack"><section class="panel"><h2>预算预估</h2><div id="cloud-price">${cloudPrice()}</div><p class="tiny muted">虚构单价。构建和评测分任务计费，不重复计算；正式服务按实际用量核对账单。</p></section><section class="panel" id="cloud-result">${cloudResult()}</section></div></div>`}
function cloudPrice(){const c=cloudEstimate();return `<div class="costline"><span>${state.cloudMode==='sft'?`${state.gpus} GPU × ${state.hours} 小时 × ¥12`:'模型调用 / 检索'}</span><b>${money(c.resource)}</b></div><div class="costline"><span>编排服务费</span><b>${money(c.service)}</b></div><div class="costline"><span>独立评测预算</span><b>${money(c.evaluation)}</b></div><div class="costline"><b>合计</b><b class="metric">${money(c.total)}</b></div>`}
function recipe(){const v=ver(state.cloudVersionId),e=evalSet(state.evalSetId);return {demo:true,mode:state.cloudMode,datasetId:v?.id,datasetVersion:v?.version,licenseId:v?.licenseId,evalSet:e,base:state.cloudMode==='sft'?'compatible-7b-lora':'office-rag-tools',provider:'待接入云合作方 A',hours:state.hours,gpus:state.gpus,budgetCap:state.budget,estimate:cloudEstimate(),notice:'仅示例配置，未启动真实资源'}}
function startCloud(){const error=s=>{$('#cloud-error').textContent=s;toast(s)};if(activeCloud())return error('请等待或取消当前演示任务');const v=ver(state.cloudVersionId),e=evalSet(state.evalSetId);if(!v||!can(v,'train'))return error('当前输入版本未获得训练与应用许可');if(!e||!e.permitted)return error('所选评测集没有相应使用许可');if(e.id===v.id||e.root===v.root)return error('训练数据及其同源衍生版本不能作为独立评测集');if(!state.cloudRights||!state.evalConfirm)return error('请确认授权范围及独立评测安排');const cfg=recipe();if(!Number.isFinite(cfg.budgetCap)||cfg.budgetCap<cfg.estimate.total)return error('预算上限低于构建与评测合计费用');const t=addTask({type:state.cloudMode==='sft'?'training':'agent',inputVersionId:v.id,licenseId:v.licenseId,estimate:cfg.estimate.resource+cfg.estimate.service,config:cfg,evalSetId:e.id,logs:[`输入锁定 ${v.id} / v${v.version}，许可 ${v.licenseId}`,`预留独立评测 ${e.id} / v${e.version}`]});state.lastCloudTaskId=t.id;$('#toast').classList.remove('show');render();simulate(t,()=>{const m=freeze({id:next('M'),name:t.type==='training'?'办公模型 LoRA · 示例':'办公知识 Agent · 示例',base:cfg.base,inputVersionId:v.id,licenseId:v.licenseId,taskId:t.id});state.models.push(m);t.outputModelId=m.id;const et=addTask({type:'evaluation',inputVersionId:v.id,licenseId:v.licenseId,inputModelId:m.id,parentTaskId:t.id,evalSetId:e.id,evalSnapshot:e,estimate:cfg.estimate.evaluation,config:cfg,logs:[`比较基线 ${cfg.base} 与产物 ${m.id}`,`评测集 ${e.id} / v${e.version}，${e.count} 条；示例不执行真实推理`]});t.evaluationTaskId=et.id;simulate(et,()=>{const baselinePassed=Math.round(e.count*.68),afterPassed=Math.round(e.count*.77);et.report=freeze({demo:true,evaluationTaskId:et.id,trainingTaskId:t.id,inputVersionId:v.id,inputVersion:v.version,licenseId:v.licenseId,modelId:m.id,baseline:cfg.base,evaluationSet:e,metrics:{sampleCount:e.count,baselinePassed,afterPassed,baselinePercent:Math.round(1000*baselinePassed/e.count)/10,afterPercent:Math.round(1000*afterPassed/e.count)/10},recommendation:'增加表格汇总边界与统计口径的训练样本，再检查重复数据。',notice:'全部指标为虚构演示，未训练、未评测真实模型；建议只回传问题类型，不回流评测题目和答案'});et.logs.push('已生成关联固定数据、模型与评测集的示例报告')})})}
function simulate(t,done){const timer=setInterval(()=>{if(t.status!=='running'){clearInterval(timer);timers.delete(t.id);return}t.progress+=25;t.logs.push(`本地状态模拟 ${t.progress}%`);if(t.progress>=100){t.progress=100;t.status='completed';t.billed=t.estimate;clearInterval(timer);timers.delete(t.id);done()}refreshTaskUI()},400);timers.set(t.id,timer)}
function refreshTaskUI(){if(state.page==='cloud'){$('#cloud-result').innerHTML=cloudResult();if(!activeCloud())render()}if(state.page==='workspace'&&state.workspaceTab==='tasks')render();if(state.modalTaskId&&$('#modal').open)taskModal(state.modalTaskId)}
function cancelTask(id){const t=task(id);if(!t||t.status!=='running')return;clearInterval(timers.get(id));timers.delete(id);t.status='canceled';t.billed=0;t.logs.push('演示已取消，未创建真实资源；本 Demo 取消费用为 0，正式按实际用量结算');if(t.type==='training'||t.type==='agent')t.logs.push('未创建下游评测任务');refreshTaskUI();toast('演示任务已取消')}
function cloudResult(){const t=task(state.lastCloudTaskId);if(!t)return '<span class="tag">尚未创建</span><h3 style="margin-top:12px">执行与评测记录</h3><p class="sm muted">构建产物关联输入版本；独立评测关联模型和固定评测集。可随时从任务中心找回历史报告。</p>';const e=task(t.evaluationTaskId),active=t.status==='running'?t:e?.status==='running'?e:null;let html=`<h3>最近任务 ${t.id}</h3><p class="tiny muted">输入 ${t.inputVersionId} · 许可 ${t.licenseId}<br>${esc(vname(ver(t.inputVersionId)))}</p>`;if(active)return html+statusBadge(active.status)+`<p class="sm" style="margin-top:10px">${typeName(active.type)} ${active.id}</p><div class="progress"><i style="width:${active.progress}%"></i></div><p class="tiny muted">本地状态模拟 · ${active.progress}%</p><div class="result-actions"><button class="small" data-task="${active.id}">任务详情</button><button class="small danger" data-cancel="${active.id}">取消任务</button></div>`;if(t.status==='canceled'||e?.status==='canceled')return html+`<span class="tag amber">${e?'评测':'构建'}已取消</span><p class="sm muted" style="margin-top:10px">${e?'构建产物仍保留，尚无完成的评测报告。':'未产生构建产物或评测报告。'}</p><button class="small" data-task="${e?.id||t.id}">查看任务记录</button>`;if(e?.report)return html+reportSummary(e);return html+statusBadge(t.status)}
function reportSummary(t){const r=t.report,m=r.metrics;return `<span class="tag green">独立评测完成 · 模拟</span><div class="task-summary"><b>产物 ${r.modelId}</b><div class="tiny muted">${r.evaluationSet.name} v${r.evaluationSet.version}<br>${r.evaluationSet.count} 条 · ${t.id}</div></div><div class="result-bars"><div class="bar-row"><span>基线</span><div class="bar"><i style="width:${m.baselinePercent}%"></i></div><b>${m.baselinePercent}%</b></div><div class="bar-row"><span>构建后</span><div class="bar"><i class="teal" style="width:${m.afterPercent}%"></i></div><b>${m.afterPercent}%</b></div></div><p class="tiny muted">虚构指标，仅展示报告结构；不表示实际效果提升。</p><div class="result-actions"><button class="small" data-task="${t.id}">报告关联</button><button class="small" data-report="${t.id}">下载报告</button><button class="small teal" data-feedback="${t.id}">带着问题继续加工 →</button></div>`}
function feedback(id){const t=task(id);if(!t?.report)return;state.feedback={evalId:id,text:t.report.recommendation};state.sourceId=t.inputVersionId;state.outputId=null;state.plan=null;state.instruction='过滤空问题和空答案，去重。';state.modalTaskId=null;if($('#modal').open)$('#modal').close();navigate('studio')}

function taskModal(id){const t=task(id);if(!t)return;state.modalTaskId=id;const v=ver(t.inputVersionId);modal(typeName(t.type)+' · '+t.id,`<div class="flex between">${statusBadge(t.status)}<span class="tiny muted">${t.created} · 本地演示</span></div><div class="license-facts"><div><small>固定输入版本</small><b>${t.inputVersionId} / v${v.version}</b><button class="plain-link tiny" data-version="${v.id}">${esc(v.name)}</button></div><div><small>来源许可</small><b>${t.licenseId}</b><button class="plain-link tiny" data-license="${t.licenseId}">${esc(lic(t.licenseId).name)}</button></div><div><small>模拟结算 / 预估</small><b>${t.billed===null?'待结算':money(t.billed)} / ${money(t.estimate)}</b></div></div>${t.outputVersionId?`<p class="sm">加工产物：<button class="plain-link" data-version="${t.outputVersionId}">${t.outputVersionId} · 查看版本与来源</button></p>`:''}${t.outputModelId?`<p class="sm">构建产物：${t.outputModelId} · ${esc(model(t.outputModelId).name)}</p>`:''}${t.parentTaskId?`<p class="sm">上游构建：<button class="plain-link" data-task="${t.parentTaskId}">${t.parentTaskId}</button> · 模型 / Agent ${t.inputModelId}</p>`:''}${t.evaluationTaskId?`<p class="sm">下游独立评测：<button class="plain-link" data-task="${t.evaluationTaskId}">${t.evaluationTaskId}</button></p>`:''}${t.evalSetId?`<p class="sm muted">评测数据：${t.evalSetId} · v${t.config?.evalSet?.version||'1.0'} · ${t.config?.evalSet?.count||0} 条</p>`:''}${t.feedbackEvalId?`<p class="sm">参考问题来源：<button class="plain-link" data-task="${t.feedbackEvalId}">${t.feedbackEvalId}</button></p>`:''}${t.report?reportSummary(t):''}<details ${t.report?'':'open'}><summary>执行日志与处理配方</summary><ul class="log">${t.logs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${t.plan?`<div class="sample"><code>${esc(JSON.stringify(t.plan,null,2))}</code></div>`:''}</details>`,`<button data-action="close-modal">关闭</button><button data-download-task="${t.id}">下载任务记录</button>${t.status==='running'?`<button class="danger" data-cancel="${t.id}">取消演示任务</button>`:''}`)}
function enterVersion(id,destination){const v=ver(id);if(!v)return;state.modalTaskId=null;if($('#modal').open)$('#modal').close();if(destination==='cloud'){if(activeCloud())return toast('请先等待或取消当前构建与评测');state.cloudVersionId=id;state.cloudRights=false;state.evalConfirm=false;navigate('cloud')}else{state.sourceId=id;state.plan=null;state.outputId=null;state.feedback=null;navigate('studio')}}
function bindPage(){if($('#search'))$('#search').oninput=e=>{state.query=e.target.value;$('#product-list').innerHTML=productCards()};if($('#source'))$('#source').onchange=e=>{state.sourceId=e.target.value;state.plan=null;state.outputId=null;state.feedback=null;render()};if($('#upload'))$('#upload').onchange=upload;for(const key of ['process','train','resell'])if($('#upload-'+key))$('#upload-'+key).onchange=e=>state.uploadDraft[key]=e.target.checked;if($('#instruction'))$('#instruction').oninput=e=>{state.instruction=e.target.value;state.plan=null;$$('[data-action="run"],[data-action="dry-run"]').forEach(b=>b.disabled=true)};if($('#cloud-version'))$('#cloud-version').onchange=e=>{state.cloudVersionId=e.target.value;state.cloudRights=false;state.evalConfirm=false;render()};if($('#eval-set'))$('#eval-set').onchange=e=>{state.evalSetId=e.target.value;state.evalConfirm=false;render()};if($('#hours'))$('#hours').oninput=e=>{state.hours=+e.target.value;$('#hours-label').textContent=state.hours;$('#cloud-price').innerHTML=cloudPrice()};if($('#gpus'))$('#gpus').onchange=e=>{state.gpus=+e.target.value;$('#cloud-price').innerHTML=cloudPrice()};if($('#budget'))$('#budget').oninput=e=>state.budget=Number(e.target.value);if($('#training-rights'))$('#training-rights').onchange=e=>state.cloudRights=e.target.checked;if($('#eval-separate'))$('#eval-separate').onchange=e=>state.evalConfirm=e.target.checked;if($('#task-type'))$('#task-type').onchange=e=>{state.taskType=e.target.value;render()};if($('#task-status'))$('#task-status').onchange=e=>{state.taskStatus=e.target.value;render()}}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.nav){state.modalTaskId=null;navigate(d.nav);return}if(d.category){state.category=d.category;render();return}if(d.product){state.modalTaskId=null;showProduct(d.product);return}if(d.buykind){state.purchaseType=d.buykind;productModal();return}if(d.version){state.modalTaskId=null;versionModal(d.version);return}if(d.license){state.modalTaskId=null;licenseModal(d.license);return}if(d.task){taskModal(d.task);return}if(d.worktab){state.workspaceTab=d.worktab;navigate('workspace');return}if(d.processVersion){enterVersion(d.processVersion,'studio');return}if(d.trainVersion){enterVersion(d.trainVersion,'cloud');return}if(d.downloadVersion){const v=ver(d.downloadVersion);if(v)download(v.id+'-v'+v.version+'.jsonl',v.rows.map(x=>JSON.stringify(x)).join('\n'),'application/x-ndjson');return}if(d.downloadLicense){download(d.downloadLicense+'-license.json',JSON.stringify({demo:true,license:lic(d.downloadLicense)},null,2));return}if(d.downloadTask){download(d.downloadTask+'-task.json',JSON.stringify({demo:true,task:task(d.downloadTask)},null,2));return}if(d.publish){state.modalTaskId=null;publishVersion(d.publish);return}if(d.cancel){cancelTask(d.cancel);return}if(d.report){const t=task(d.report);if(t?.report)download(t.id+'-evaluation.json',JSON.stringify(t.report,null,2));return}if(d.feedback){feedback(d.feedback);return}if(d.mode){if(activeCloud())return toast('请等待或取消当前任务');state.cloudMode=d.mode;state.cloudRights=false;state.evalConfirm=false;render();return}if(d.prompt){state.instruction=d.prompt==='clean'?'过滤空问题和空答案，去重。':defaults;state.plan=null;state.outputId=null;render();return}const actions={reset,'close-modal':()=>{state.modalTaskId=null;$('#modal').close()},buy,plan:generatePlan,'dry-run':()=>runProcessing(true),run:()=>runProcessing(false),'register-upload':registerUpload,'official-offer':()=>officialOffer(false),'author-review':()=>officialOffer(true),'send-offer':()=>{state.offer='sent';$('#modal').close();render();toast('已创建模拟邀约，未联系真实作者')},'accept-offer':acceptOfficial,'official-process':()=>enterVersion(state.officialVersionId,'studio'),'go-official':()=>{$('#modal').close();navigate('official')},'confirm-publish':confirmPublish,'start-cloud':startCloud,'download-recipe':()=>download('cloud-config-demo.json',JSON.stringify(recipe(),null,2)),'clear-feedback':()=>{state.feedback=null;render()},'publish-source':()=>{state.sourceId='upload';state.plan=null;state.outputId=null;navigate('studio');toast('导入文件并登记权利声明后，可加工或在版本详情中提交发布')}};if(actions[d.action])actions[d.action]()});

const providers={partner:{name:'合作 API 网关 A',rate:1,settlementRate:.8},direct:{name:'模型厂商直连',rate:1.5,settlementRate:1.5}};
const baseCost=processingCost;
processingCost=function(){const c=baseCost(),p=providers[state.apiProvider||'partner'];const tokens=state.plan?.rewrite?(current()?.rows.length||0)*100:0;const resource=Math.round(tokens*p.rate/1000*100)/100;return {...c,resource,total:c.service+resource,provider:p.name,providerId:state.apiProvider||'partner',model:'通用文本模型 · 示例',inputTokens:Math.round(tokens*.75),outputTokens:Math.round(tokens*.25),rate:p.rate,upstreamCost:Math.round(tokens*p.settlementRate/1000*100)/100,usage:'模拟 Token 用量，未调用外部 API'}};
const baseStudio=studio;
studio=function(){let s=baseStudio();s=s.replace('模型 / 资源估算','API 调用费 · 模拟').replace('运行后记录模拟账单；无真实收费。','API 费用按输入 / 输出 Token 及供应商单价结算；示例单价相同。平台服务费与 API 费用分列，未产生真实请求。');const p=providers[state.apiProvider||'partner'];return s.replace('<h3>本次费用预览</h3>',`<h3>API 合作与费用</h3><label class="field" for="api-provider">模型调用供应商</label><select id="api-provider">${Object.entries(providers).map(([id,x])=>`<option value="${id}" ${id===(state.apiProvider||'partner')?'selected':''}>${x.name} · ¥${x.rate} / 千 Token</option>`).join('')}</select><p class="tiny muted">两条渠道均为虚构。正式接入核对上游转售许可、保留策略、稳定性与结算；正式外发前须确认授权与供应商保留策略；API Key 不进入数据商品。</p><label class="checkline"><input type="checkbox" id="trace-consent" ${state.traceConsent?'checked':''}>可选：允许本次加工轨迹经审核后形成销售数据包，按另行约定分成。</label><p class="tiny muted">默认不勾选；拒绝不影响加工。此演示仅打包操作、参数和统计，不收录源文件内容或原始提示词。</p>`)};

const baseRunProcessing=runProcessing;
runProcessing=function(preview=false){const before=state.tasks.length,c=processingCost(),consent=!!state.traceConsent;baseRunProcessing(preview);if(!preview&&state.tasks.length>before){const t=state.tasks.at(-1);t.fees=freeze(copy(c));t.traceConsent=consent;state.traceConsent=false;t.logs.push(`费用快照：服务费 ${money(c.service)} + API ${money(c.resource)}；${c.provider}，${c.inputTokens+c.outputTokens} 模拟 Token`);t.logs.push(consent?'本次任务已单独确认轨迹回流意向；商品发布仍需审核':'本次未授权轨迹商品化');render()}};

function showBenchmark(id){const b=bench(id);if(!b)return;state.selectedBench=id;modal(esc(b.name),`<div class="flex between wrap">${benchBadge(b)}<span class="tiny muted">${b.id} · v${esc(b.version)} · 2026-10-22</span></div><p>${esc(b.desc)}</p><div class="benchmark-scoreboard"><div><span>示例 Agent A</span><b>${pct(b.passed,b.sampleCount)}%</b><small>${b.passed}/${b.sampleCount} 通过</small></div><div><span>示例 Agent B</span><b>${pct(Math.min(b.sampleCount,b.passed+20),b.sampleCount)}%</b><small>${Math.min(b.sampleCount,b.passed+20)}/${b.sampleCount} 通过</small></div><div><span>参考条件</span><b>单次运行</b><small>未据此推断真实模型强弱</small></div></div><p class="notice amber">内置分数全部为虚构演示。作者新提交的数据只显示“作者自报”，不会自动获得平台复跑或专家标签。</p><details open><summary>评测条件与报告范围</summary><div class="license-facts"><div><small>模型与工具</small><b>${esc(b.modelName||'示例 Agent A / B v1')}</b><span>${esc(b.env)} · tools 1.0</span></div><div><small>评分与运行</small><b>交付物检查器 v1.0</b><span>prompt P-01 · 温度 0 · 每题 8k token / 120 秒</span></div><div><small>样本与复核</small><b>${b.sampleCount} 题 · 1 次 / 题</b><span>${b.level==='expert'?`${b.reviewed} 题抽检，非全量保证`:b.level==='reproduced'?'复跑记录示例，未做专家抽检':'尚未独立复跑'}</span></div></div><p class="tiny muted">不跨版本混排总榜；小样本和单次运行的不确定性仍需报告。任务变更后原标签与成绩不沿用。</p></details><h3>三类资产分别交付</h3><div class="split-assets"><div><b>公开展示版</b><p>任务定义、少量样例、方法和报告摘要。</p><button class="small" ${id==='B-001'?'data-v4="sample"':'data-v4="sample-info"'}>查看样例</button></div><div><b>商业训练版</b><p>另行授权的任务、轨迹、环境与验收器。</p><button class="small" data-bench-product="${id}">关联商品</button></div><div><b>隐藏评测版</b><p>由服务端保管；只交付汇总诊断与约定报告。</p><button class="small" data-eval-bench="${id}">私有试测</button></div></div><details><summary>作者与衍生版本</summary><p class="sm">${esc(b.author)}。展示许可、训练许可、改编与再销售权分别确认。论文发布自由依作者协议约定；不通过抹去来源来阻止买卖双方联系。</p></details>`,`<button data-v4="trust">标签规则</button><button data-demand-bench="${id}">按此任务提需求</button><button class="primary" data-eval-bench="${id}">创建私有评测 →</button>`)}
function sampleModal(){modal('公开样例 01 · 订单与回款核对',`<p class="sm">对订单按 order_id 去重，扣减退款，汇总回款并列出未回款。此题属于公开样例，可见参考规则，不用于证明独立提升。</p><div class="sample"><code>订单：O-001 1000；O-002 600；O-002 600（重复）；O-003 800\n退款：O-002 100\n回款：O-001 800；O-002 500；O-003 800</code></div><label class="field">输入交付结果 JSON<textarea id="sample-answer" rows="7">${esc(JSON.stringify({netRevenue:2900,received:2100,exceptions:[{orderId:'O-001',gap:200}]},null,2))}</textarea></label><p class="tiny muted">浏览器实际运行确定性规则检查；不调用大模型，不产生 API 费用。</p><div id="sample-check"></div>`,`<button data-v4="sample-reference">填入参考交付物</button><button class="primary" data-v4="sample-grade">运行样例检查</button>`)}

function evalModal(id,baselineId=null){const b=bench(id);modal('私有评测 · '+esc(b.name),`<p class="notice">结果默认仅买方可见。演示使用预设模型和虚构成绩，不需要填写 API 密钥。</p><div class="formgrid"><label class="field">模型配置<select id="bench-model"><option value="A">示例 Agent A v1</option><option value="B">示例 Agent B v1</option></select></label><label class="field">API 计费方式<select id="bench-provider"><option value="partner">合作 API 服务商</option><option value="own">客户自带 API</option></select></label><label class="field">预算上限 元<input id="bench-budget" type="number" min="0" value="200"></label><label class="field">专家抽检<select id="bench-expert"><option value="no">不加购</option><option value="yes">加购 24 题抽检</option></select></label></div><label class="checkline"><input id="bench-consent" type="checkbox">确认评测用途许可与固定版本；私有结果不默认公开</label>${baselineId?`<label class="field">复测候选<select id="bench-candidate"><option value="prompt">提示词候选 P-02 · 演示</option>${state.models.map(m=>`<option value="${m.id}">${esc(m.name)} · ${m.id} · 输入 ${m.inputVersionId}</option>`).join('')}</select></label><label class="checkline"><input id="bench-separate" type="checkbox">确认候选模型的数据与隐藏评测集独立，复测只改变所选优化项</label><p class="sm">对比基线 <b>${baselineId}</b>；模型主版本、任务版本与预算条件须一致。复测展示预设的“总体提升、局部退步”示例。</p>`:''}<div id="bench-price" class="notice"></div><p class="tiny muted">服务费 ¥50 + 环境费 ¥18 + 合作 API 估算 ¥12；可选专家服务 ¥120。客户自带 API 由客户另付上游，平台账单不重复计费。均为测试价格。</p><p class="tiny muted">不自动保存或转售调用内容；评测题目、答案和客户私有输出默认不进入轨迹商品池。</p><p id="bench-error" role="alert" class="error"></p>`,`<button data-action="close-modal">取消</button><button class="primary" data-start-bench="${id}" data-baseline="${baselineId||''}">确认预算并模拟运行</button>`);const update=()=>{$('#bench-price').textContent='平台预估：¥'+(68+($('#bench-provider').value==='partner'?12:0)+($('#bench-expert').value==='yes'?120:0))};$('#bench-provider').onchange=update;$('#bench-expert').onchange=update;if(baselineId){$('#bench-model').value=task(baselineId).config.model;$('#bench-model').disabled=true;$('#bench-provider').value=task(baselineId).config.provider;$('#bench-provider').disabled=true}update()}
function startBench(id,baselineId){const b=bench(id);const modelId=$('#bench-model').value,provider=$('#bench-provider').value,expert=$('#bench-expert').value==='yes';const estimate=68+(provider==='partner'?12:0)+(expert?120:0),cap=+$('#bench-budget').value;const err=m=>{$('#bench-error').textContent=m};if(!$('#bench-consent').checked)return err('请先确认评测许可与私有结果设置。');if(!Number.isFinite(cap)||cap<estimate)return err('预算上限低于本次预估费用。');const candidate=baselineId?$('#bench-candidate').value:null;const cm=candidate&&candidate!=='prompt'?model(candidate):null;if(baselineId&&!$('#bench-separate').checked)return err('请确认复测候选与隐藏评测集的独立性。');const cfg={candidateModelId:cm?.id||null,candidateDataVersionId:cm?.inputVersionId||null,candidateBuildTaskId:cm?.taskId||null,changedVariable:baselineId?(cm?'model-artifact':'prompt-P02'):'baseline',model:modelId,modelVersion:'v1',provider,benchmarkId:id,benchmarkVersion:b.version,environment:b.env,scorer:'artifact-checker-v1',prompt:baselineId&&!cm?'P-02':'P-01',temperature:0,repeats:1,maxTokens:8000,timeoutSeconds:120,sampleCount:b.sampleCount,budget:cap,expert,visibility:'private',traceReuse:false};const t=addTask({type:'benchmark',benchmarkId:id,baselineId:baselineId||null,config:cfg,estimate,logs:[`锁定 ${id} v${b.version} / ${b.env}`,`报告私有；不回流隐藏题目或客户输出`,`预估费用 ${estimate} 元；未调用真实 API`]});state.lastBenchTask=t.id;$('#modal').close();navigate('workspace');state.workspaceTab='tasks';render();timers.set(t.id,setInterval(()=>{t.progress+=25;if(t.progress>=100){clearInterval(timers.get(t.id));timers.delete(t.id);let passed=modelId==='A'?b.passed:Math.min(b.sampleCount,b.passed+20);if(baselineId)passed=id==='B-001'?task(baselineId).report.buckets.reduce((n,x,i)=>n+Math.min(40,Math.max(0,x.passed+[8,7,-2][i])),0):Math.min(b.sampleCount,task(baselineId).report.passed+13);t.status='completed';t.billed=estimate-(expert?120:0);t.reservedExpert=expert?120:0;t.report=freeze({id:'R-'+t.id,demo:true,benchmarkId:id,benchmarkVersion:b.version,passed,sampleCount:b.sampleCount,model:modelId,baselineId:baselineId||null,conditions:copy(cfg),visibility:'private',scope:'虚构演示成绩，未运行真实模型或隐藏评测',buckets:id==='B-001'?[{name:'重复订单',passed:baselineId?Math.min(40,task(baselineId).report.buckets[0].passed+8):modelId==='A'?24:32,total:40},{name:'跨月退款',passed:baselineId?Math.min(40,task(baselineId).report.buckets[1].passed+7):modelId==='A'?18:26,total:40},{name:'回款差异',passed:baselineId?Math.max(0,task(baselineId).report.buckets[2].passed-2):modelId==='A'?20:24,total:40}]:[],expertStatus:expert?'待人工复核':'未申请'});state.benchReports.push(t.id);t.logs.push('生成固定条件的示例诊断报告；专家服务另建待审核任务');if(expert){addTask({type:'expert_review',benchmarkId:id,parentTaskId:t.id,status:'pending',progress:0,billed:null,estimate:120,logs:['评测已预留专家费用；本记录不重复计费','待分配评审员，尚未产生任何质量标签'],includedInTask:t.id})}}if(state.page==='workspace')render()},450));toast('已创建模拟评测任务，可在任务中心取消或查看结果')}
function benchReport(id){const t=task(id);if(!t)return;const b=bench(t.benchmarkId),r=t.report,baseline=r?.baselineId?task(r.baselineId).report:null;modal('私有诊断报告 · '+id,`<div class="flex between wrap">${statusBadge(t.status)}<span class="tag">私有结果 · 演示</span></div><p><b>${esc(b.name)}</b> · ${t.benchmarkId} v${esc(t.config.benchmarkVersion)} · 示例 Agent ${t.config.model} ${t.config.modelVersion}</p>${r?`<div class="report-score"><strong>${pct(r.passed,r.sampleCount)}<small>%</small></strong><div>${r.passed} / ${r.sampleCount} 任务通过<br><span class="tiny muted">虚构成绩 · 1 次 / 题 · 不据此判断真实模型能力</span></div>${baseline?`<div class="report-delta">${(100*(r.passed-baseline.passed)/r.sampleCount).toFixed(1)} pp<small>相对基线 ${r.baselineId}</small></div>`:''}</div>${r.buckets.length?`<div class="table-wrap"><table><thead><tr><th>问题类型</th><th>通过数</th><th>结果</th></tr></thead><tbody>${r.buckets.map((x,i)=>`<tr><td>${x.name}</td><td>${x.passed}/${x.total}</td><td>${baseline?`${x.passed-baseline.buckets[i].passed>=0?'+':''}${x.passed-baseline.buckets[i].passed} 题${x.passed<baseline.buckets[i].passed?' · 存在退步':''}`:'优先诊断失败原因'}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="notice ${baseline?'amber':''}">${baseline?'总体改善不代表各项改善；回款差异存在退步，应先复核。':'先检查提示词、工具与业务规则，再决定是否采购数据或训练。'} 报告只向加工环节传递问题类型和任务编号。</div><p class="sm">专家状态：${r.expertStatus}。付费不会自动产生通过标签。</p>`:`<p>任务进度 ${t.progress}%。${t.status==='canceled'?'已取消，不生成报告。':'尚未生成成绩。'}</p>`}${t.config.candidateModelId?`<p class="sm">复测产物 ${t.config.candidateModelId} · 构建 ${t.config.candidateBuildTaskId} · 数据 <button class="plain-link" data-version="${t.config.candidateDataVersionId}">${t.config.candidateDataVersionId}</button></p>`:''}<details><summary>固定配置与独立性记录</summary><div class="sample"><code>${esc(JSON.stringify(t.config,null,2))}</code></div><p class="sm muted">隐藏评测资产不向训练导出。论文公开题与已售训练题需做重合检查、分组隔离；相关评测版本若泄露，应退役并重建。</p></details><p class="sm muted">平台模拟账单 ${t.billed===null?'待结算':money(t.billed)}，预估 ${money(t.estimate)}。${t.config. document.addEventListener('click',e=>{const b=e.target.closest('button[data-request-review]');if(!b)return;const id=b.dataset.requestReview;if(state.tasks.some(t=>t.type==='expert_review'&&t.benchmarkId===id&&t.status==='pending'))return toast('该版本已有待审核申请');addTask({type:'expert_review',benchmarkId:id,status:'pending',progress:0,billed:null,estimate:0,logs:['申请复跑与专家审核报价；待材料核验','未收费、未授予标签']});$('#modal').close();state.workspaceTab='tasks';navigate('workspace')});

// Product v5: a runnable package contract and transparent procurement planning.
function v5State(){v4State();state.procurements??=[];}
function packSpec(){return {schema:'shuzuo.task-package/1.0',status:'proposed-demo-spec',packageId:'PK-RECON-001',version:'1.0',benchmarkRef:'B-001@1.0',sourceFamily:'training-reconciliation-2026Q4',license:{kind:'organization-nonexclusive',owner:'示例作者工作室',training:true,internalEvaluation:true,redistribution:false,derivativeResale:false,exclusive:false},assets:[{kind:'taskset',count:60,format:'JSONL + CSV',fields:['instruction','input_files','expected_artifact','rubric','source_id']},{kind:'environment',version:'recon-env-1.0',interface:'reset / step / grade',requirements:'固定依赖、镜像摘要、初始快照与重置检查；交付时补齐真实摘要'},{kind:'grader',version:'recon-checker-1.0',checks:['净额','回款','完整异常清单'],evidence:'正例、空输出、错误类型、漏报与误报测试记录'},{kind:'lineage',format:'manifest.json',fields:['source_license','author','parent_version','transform_recipe','review_scope']}],delivery:{runtimes:['客户自有环境','平台环境'],supportDays:30,acceptanceDays:7,breakingUpdate:'新版本重新验收；旧授权版本不覆盖'},evaluation:{hiddenSetIncluded:false,trainEvalSeparation:'按来源家族隔离与近似查重，独立评测另购'},review:{state:'pending',method:'任务规则校准 → 两名独立评审 → 分歧仲裁',coverage:'关键金额规则逐项审核，语义抽检另列分母与范围'},traceReuse:false};}
const v5BenchmarkHome=benchmarkHome;
benchmarkHome=function(){return v5BenchmarkHome().replace('先发现任务缺口，<br>再找到有效的数据。','先验证任务，<br>再采购可交付的改进。').replace('用可复核的 Benchmark 连接买方与专家。<br>试测、采购任务包、定向加工，再做独立复测。','围绕中文办公业务规则，连接专家任务包与买方。<br>看证据、试样验收、按版本交付，再做独立复测。').replace('<div class="section-title section">','<section class="proc-strip"><div><b>01  试样验证</b><span>小包可运行 · 验收器可检查</span></div><div><b>02  按版本采购</b><span>任务、环境、许可与支持范围</span></div><div><b>03  更新与复测</b><span>费用分列 · 保留旧版本与失败记录</span></div><button data-v5="pack">查看交付规格 ↗</button></section><div class="section-title section">');};
const v5ShowBenchmark=showBenchmark;
showBenchmark=function(id){v5ShowBenchmark(id);if(id==='B-001'){$('#modal .modalbody').insertAdjacentHTML('beforeend',`<section class="package-prompt"><div><h3>把业务任务变成可验收的商品</h3><p class="sm muted">60 个商业任务 + 环境规范 + 验收器 + 来源清单。与隐藏评测资产分别授权。</p></div><div class="flex wrap"><button data-v5="pack">检查交付规格</button><button class="primary" data-v5="procure">试样与采购计划</button></div></section>`);}};
function packageModal(){const spec=packSpec();modal('多表核对任务包 · 交付规格',`<div class="flex between wrap"><span class="tag">PK-RECON-001 · v1.0</span><span class="tag amber">拟交付规格 · 未真实交付</span></div><p>以一个团队能重放、验收和维护的任务包为商品单位。隐藏评测题不属于交付物。</p><div class="table-wrap"><table><thead><tr><th>组成</th><th>交付与验收要求</th></tr></thead><tbody><tr><td>60 个商业任务</td><td>输入、业务规则、参考产物、评分规则和来源编号齐全</td></tr><tr><td>可重置的运行环境</td><td>固定版本、真实镜像摘要、初始快照与重置日志；支持客户自有环境</td></tr><tr><td>验收器与自检</td><td>正例通过，空输出、漏报、误报和错误类型应被拦截</td></tr><tr><td>授权与支持</td><td>团队非独占训练使用；不含原始转售、衍生再售或隐藏题；30 天约定兼容支持</td></tr></tbody></table></div><h3>质量证据分开记录</h3><p class="sm">结构自检只检查格式和规则行为；业务正确性需独立专家复核。评审先用校准任务对齐规则，两名评审独立判断，分歧交仲裁。显示样本范围、日期和利益关系，版本变化后重新评审。</p><div id="grader-checks" class="notice">下面仅执行公开合成样例的验收器自检，不代表 60 个任务已通过审核。</div><details><summary>查看版本与权限清单</summary><div class="sample"><code>${esc(JSON.stringify(spec,null,2))}</code></div></details>`,`<button data-v5="grader">运行验收器自检</button><button data-v5="manifest">导出交付规格 JSON</button><button class="primary" data-v5="procure">制定采购计划 →</button>`);}
function checkPublicArtifact(x){return !!x&&typeof x==='object'&&!Array.isArray(x)&&x.netRevenue===2300&&x.received===2100&&Array.isArray(x.exceptions)&&x.exceptions.length===1&&x.exceptions[0]?.orderId==='O-001'&&x.exceptions[0]?.gap===200;}
function graderChecks(){const ok={netRevenue:2300,received:2100,exceptions:[{orderId:'O-001',gap:200}]};return [{name:'正确参考产物',value:ok,expected:true},{name:'空输出',value:{},expected:false},{name:'缺少异常明细',value:{...ok,exceptions:[]},expected:false},{name:'多报一条异常',value:{...ok,exceptions:[...ok.exceptions,{orderId:'O-002',gap:0}]},expected:false},{name:'数字被替换为文本',value:{...ok,netRevenue:'2300'},expected:false},{name:'非对象输出',value:null,expected:false}].map(x=>({name:x.name,expected:x.expected,actual:checkPublicArtifact(x.value),pass:checkPublicArtifact(x.value)===x.expected}));}
function runGraderChecks(){const tests=graderChecks();$('#grader-checks').innerHTML=`<b>${tests.filter(t=>t.pass).length} / ${tests.length} 个自检用例符合预期</b>${tests.map(t=>`<div class="sm">${t.pass?'✓':'×'} ${t.name}：${t.actual?'接受':'拒绝'}</div>`).join('')}<p class="tiny muted">浏览器内真实规则检查；仅覆盖一个公开样例。未生成专家认证，也未执行真实运行环境。</p>`;}
function procurementModal(){v5State();modal('试样与采购计划',`<p class="sm muted">示例报价用于说明计费和授权结构。保存后进入待确认任务，不扣款、不授予正式数据使用权。</p><div class="purchase-options"><label><input type="radio" name="pack-plan" value="pilot" checked><b>小包试样</b><span>从完整包选取 6 个任务 · 7 天内部验证<br>试用许可 ¥200 · 不得训练</span></label><label><input type="radio" name="pack-plan" value="full"><b>完整任务包</b><span>60 个任务 · 组织商业训练 / 内部评测许可<br>版本许可 ¥4,000 + 首次适配 ¥800</span></label></div><div class="grid two"><label class="field">运行环境<select id="pack-runtime"><option value="own">客户自有环境 · 平台不收环境费</option><option value="hosted">平台环境 · 按预估量单列</option></select></label><label class="field">模型 API<select id="pack-api"><option value="byok">自带 API · 上游另行结算</option><option value="partner">合作 API · 按实际用量结算</option></select></label></div><label class="check"><input type="checkbox" id="pack-maintenance" disabled>另订版本维护 ¥1,200 / 月（完整包可选，默认不订阅）</label><p class="tiny muted">维护含每月 4 个同系列新增边界任务、固定环境小版本兼容最多 2 工时、一次 4 题复核；重大环境迁移或新业务另报价。须另行确认续费，不覆盖旧版本。隐藏评测、算力和额外 API 用量另计。</p><p class="tiny muted">试样与完整包的价格对应不同用途和期限的许可，不按行数比较。60 个任务不保证训练提分，效果须在独立评测集验证。</p><div id="pack-cost"></div><p class="sm">试样验收通过且支付后，30 天内买完整包可抵 ¥200 数据许可费；API 和环境消耗不抵扣。本演示没有已支付试样，当前抵扣为 ¥0。</p><details><summary>许可、验收与退款范围</summary><p class="sm">按约定版本核对交付清单、环境可运行性和样例验收，不承诺所有模型提分。7 天内对不符交付提出复核；先补交或修复，无法达到已约定标准的部分按约退款，API 已实际消耗部分单列。专属交付需另报价格，平台不能将客户专有数据复售。</p></details><label class="field">本次预算上限（含所选首月维护）<input type="number" id="pack-budget" min="0" value="6000"></label><label class="check"><input type="checkbox" id="pack-consent">确认用途、版本、验收范围和分列费用；未取得衍生再售授权</label><p id="pack-error" class="error" role="alert"></p>`,`<button data-v5="pack">返回规格</button><button class="primary" data-v5="save-plan">保存采购计划</button>`);updatePackCost();}
function getPackQuote(){const kind=$('input[name="pack-plan"]:checked').value;const full=kind==='full';const runtime=$('#pack-runtime').value,api=$('#pack-api').value;const maintenance=full&&$('#pack-maintenance').checked?1200:0;const data=full?4000:200,setup=full?800:0,env=runtime==='hosted'?(full?80:40):0,apiCost=api==='partner'?(full?30:6):0;return {kind,runtime,api,fees:{dataLicense:data,setup,environment:env,api:apiCost,maintenanceMonthly:maintenance},oneOff:data+setup+env+apiCost,firstPeriod:data+setup+env+apiCost+maintenance,currency:'CNY',discount:0,maintenanceScope:maintenance?{newBoundaryTasksPerMonth:4,compatibilityHoursMax:2,reviewTasksPerMonth:4,majorMigrationIncluded:false,newBusinessIncluded:false}:null,trialCreditPolicy:'已验收且付费的试样在30天内可抵200元许可费；不抵API或环境费',autoRenew:false};}
function updatePackCost(){const full=$('input[name="pack-plan"]:checked').value==='full';$('#pack-maintenance').disabled=!full;if(!full)$('#pack-maintenance').checked=false;const q=getPackQuote();$('#pack-cost').innerHTML=`<div class="quote-total"><div><small>一次性预估</small><b>${money(q.oneOff)}</b></div><div><small>可选维护</small><b>${money(q.fees.maintenanceMonthly)}<small> / 月</small></b></div><div><small>本期预算占用</small><b>${money(q.firstPeriod)}</b></div></div><p class="tiny muted">数据许可 ${money(q.fees.dataLicense)} · 首次适配 ${money(q.fees.setup)} · 环境 ${money(q.fees.environment)} · API ${money(q.fees.api)}。${q.api==='byok'?'自带 API 的上游调用费由客户另付，未包含在平台报价中。':''}${q.runtime==='own'?'客户自有资源成本未计入。':''}</p>`;}
function saveProcurement(){const q=getPackQuote(),cap=Number($('#pack-budget').value);if(!$('#pack-consent').checked)return $('#pack-error').textContent='请先确认用途、版本和费用。';if(!Number.isFinite(cap)||cap<q.firstPeriod)return $('#pack-error').textContent='预算上限不足，请调整采购范围或预算。';const spec=packSpec();if(q.kind==='pilot'){spec.license.training=false;spec.license.kind='internal-evaluation-7days';spec.assets[0].count=6;}const saved=freeze({id:'Q-'+next('P'),created:new Date().toISOString(),status:'待双方确认',demo:true,quote:copy(q),manifest:spec,budgetCap:cap,rightsGranted:false});state.procurements.push(saved);const t=addTask({type:'procurement',status:'pending',progress:0,estimate:q.firstPeriod,billed:null,planId:saved.id,logs:['冻结采购规格与费用；未付款、未交付、未产生正式许可','后续需卖方确认、付款与版本验收']});state.lastProcurementTask=t.id;procurementRecord(t.id);}
function procurementRecord(id){const t=task(id),p=state.procurements.find(q=>q.id===t?.planId);if(!p)return;modal('采购计划 · '+p.id,`<span class="tag amber">待双方确认 · 本地演示</span><p><b>PK-RECON-001 v1.0</b> · ${p.quote.kind==='pilot'?'6 个试样任务':'60 个商业任务'}</p><div class="quote-total"><div><small>一次性预估</small><b>${money(p.quote.oneOff)}</b></div><div><small>维护另计</small><b>${money(p.quote.fees.maintenanceMonthly)} / 月</b></div></div><p class="sm">当前已结算 ¥0；不自动续费。正式许可与下载权限在真实交易和验收完成后授予。本演示仅保存规格，不模拟“已认证”或“已授权”。</p><details open><summary>冻结的交付规格与费用</summary><div class="sample"><code>${esc(JSON.stringify(p,null,2))}</code></div></details>`,`<button data-v5="procure">新建计划</button><button data-export-plan="${p.id}">导出采购清单</button><button class="primary" data-v5="procurement-tasks">查看任务中心</button>`);}
const v5TaskCenter=taskCenter;
taskCenter=function(){v5State();const all=state.tasks;state.tasks=all.filter(t=>t.type!=='procurement');let html;try{html=v5TaskCenter();}finally{state.tasks=all;}html=html.replace(/(<select id="task-type"[^>]*>)/,`$1<option value="procurement" ${state.taskType==='procurement'?'selected':''}>采购计划</option>`).replace('>待复核</option>','>待处理 / 复核</option>');const visible=all.filter(t=>(state.taskType==='all'||state.taskType===t.type)&&(state.taskStatus==='all'||state.taskStatus===t.status));html=html.replace(/<span class="tag">\d+ 条记录<\/span>/,`<span class="tag">${visible.length} 条记录</span>`);const rows=visible.filter(t=>t.type==='procurement');if(rows.length){html=html.replace('<div class="task-empty">暂无符合筛选的任务。运行一次加工，记录会出现在这里。</div>','<p class="tiny muted">采购计划列在下方，保存计划不会扣款或授予使用权。</p>');html+=`<section class="panel section"><h3>采购与版本交付</h3>${rows.slice().reverse().map(t=>`<div class="activity"><div><b>${esc(t.planId)} · 待双方确认</b><div class="tiny muted">${esc(t.id)} · 预算占用 ${money(t.estimate)} · 未扣款 / 未授予正式许可</div></div><button data-task="${t.id}">采购清单</button></div>`).join('')}</section>`;}return html;};
const v5TaskModal=taskModal;taskModal=function(id){if(task(id)?.type==='procurement')return procurementRecord(id);return v5TaskModal(id);};
const v5BenchReport=benchReport;benchReport=function(id){v5BenchReport(id);const t=task(id);if(!t?.report)return;const r=t.report;const base=r.baselineId?task(r.baselineId):null;const value=(x)=>x.report.passed>0?money(x.billed/x.report.passed):'—';$('#modal .modalbody').insertAdjacentHTML('beforeend',`<section class="package-prompt"><h3>同时看效果和本次评测费用</h3><p class="sm">本次通过 ${r.passed} 题，已结算模拟评测费用 ${money(t.billed)}，折合 ${value(t)} / 通过任务。${base?`基线为 ${value(base)} / 通过任务。`:''}</p><p class="tiny muted">这是本次评测服务费用口径，含本次已结算的平台项目；不含数据采购、训练、专家待结算费用及客户自有资源。不能当作生产推理单价、ROI 或真实提分收益。</p></section>`);};
document.addEventListener('change',e=>{if(e.target.matches('[name="pack-plan"],#pack-runtime,#pack-api,#pack-maintenance'))updatePackCost();if(e.target.matches('[name="pack-plan"],#pack-runtime,#pack-api,#pack-maintenance,#pack-consent')&&$('#pack-error'))$('#pack-error').textContent='';});
document.addEventListener('input',e=>{if(e.target.id==='pack-budget'&&$('#pack-error'))$('#pack-error').textContent='';});
foot=function(){return '<div class="footer-note"><span>v5.0 · 交互演示。模型成绩、订单、API、环境和专家审核为模拟；本地过滤、去重及公开样例检查可实际运行。刷新清空本次记录。</span><span>数作 · 专业任务与数据交付</span></div>'};
document.addEventListener('click',e=>{const el=e.target.closest('[data-v5],[data-export-plan]');if(!el)return;if(el.dataset.exportPlan){const p=state.procurements.find(x=>x.id===el.dataset.exportPlan);if(p)download(p.id+'.json',JSON.stringify(p,null,2));return;}switch(el.dataset.v5){case 'pack':packageModal();break;case 'grader':runGraderChecks();break;case 'manifest':download('task-package-spec-v1.json',JSON.stringify(packSpec(),null,2));break;case 'procure':procurementModal();break;case 'save-plan':saveProcurement();break;case 'procurement-tasks':$('#modal').close();state.workspaceTab='tasks';navigate('workspace');break;}});
v5State();render();
