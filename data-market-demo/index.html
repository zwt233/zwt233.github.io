async function upload(e){const file=e.target.files[0];if(!file)return;if(file.size>1024*1024)return toast('文件不得超过 1 MB');try{const text=await file.text();let rows;try{rows=JSON.parse(text)}catch{rows=text.split(/\r?\n/).filter(x=>x.trim()).map(x=>JSON.parse(x))}if(!Array.isArray(rows)||!rows.length||rows.length>5000||rows.some(x=>!x||typeof x!=='object'||Array.isArray(x)||!('question'in x)||!('answer'in x)))throw Error('需要含 question、answer 的非空数组或 JSONL，最多 5,000 条');state.uploadDraft={name:file.name,process:false,train:false,resell:false,rows:rows.map((x,i)=>({id:String(x.id||'local-'+i),question:String(x.question??''),answer:String(x.answer??''),domain:String(x.domain||'未分类')}))};render();toast('文件已本地读取，登记权利声明后可加工')}catch(err){toast('读取失败：'+err.message)}}
function registerUpload(){const u=state.uploadDraft;if(!u?.process)return toast('请先读取文件并确认加工权利');const l=addLicense({name:'本地文件权利声明',kind:'upload',author:'本地文件提供者',holder:'当前工作室',evidence:'作者自行声明 · 未专业核验',expires:'按权利依据约定',rights:{process:u.process,train:u.train,resell:u.resell}});const v=addVersion({name:u.name,root:'upload-'+l.id,version:'1.0',rows:u.rows,licenseId:l.id,origin:'upload'});state.sourceId=v.id;state.uploadDraft=null;state.plan=null;state.outputId=null;render();toast('已登记独立源版本 '+v.id)}
function processingCost(){const n=current()?.rows.length||0,service=Math.max(10,Math.ceil(n/1000)*5),resource=state.plan?.rewrite?Math.max(2,Math.ceil(n/1000)*2):0;return {service,resource,total:service+resource}}
function generatePlan(){if(!current())return toast('请先登记或选择一个数据版本');const text=$('#instruction').value;state.instruction=text;const a=text.match(/办公\s*(\d{1,3})\s*%/),b=text.match(/分析\s*(\d{1,3})\s*%/);const ratio=a?+a[1]:b?100-Number(b[1]):70;if(ratio<0||ratio>100||a&&b&&Number(a[1])+Number(b[1])!==100)return toast('办公与分析配比需合计 100%');const neg=k=>new RegExp('(不|不要|无需)'+k).test(text);const plan={filter:/过滤|清洗|空/.test(text)&&!neg('过滤'),dedup:/去重|重复/.test(text)&&!neg('去重'),rewrite:/改写|指令/.test(text)&&!neg('改写'),mix:/配比|混合|办公.*%/.test(text)&&!neg('配比'),ratio};if(!['filter','dedup','rewrite','mix'].some(k=>plan[k]))return toast('本 Demo 支持过滤、去重、改写和配比');state.plan=plan;state.outputId=null;render();toast('已生成可检查的处理计划')}
function processRows(raw,plan){let rows=copy(raw),input=rows.length,filtered=0,duplicates=0,unselected=0;if(plan.filter){const n=rows.length;rows=rows.filter(x=>String(x.question).trim()&&String(x.answer).trim());filtered=n-rows.length}if(plan.dedup){const seen=new Set;rows=rows.filter(x=>{const key=String(x.question).trim()+'\u0000'+String(x.answer).trim();if(seen.has(key)){duplicates++;return false}seen.add(key);return true})}if(plan.rewrite)rows=rows.map(x=>({...x,original_question:x.original_question||x.question,question:'请完成以下专业任务：'+String(x.original_question||x.question).trim().replace(/[？?。]$/,'')+'。'}));if(plan.mix){const office=rows.filter(x=>x.domain==='办公'),analysis=rows.filter(x=>x.domain==='分析'),n=Math.min(10,rows.length),a=Math.round(n*plan.ratio/100),picked=[...office.slice(0,a),...analysis.slice(0,n-a)];unselected=rows.length-picked.length;rows=picked}return {rows,input,filtered,duplicates,unselected,office:rows.filter(x=>x.domain==='办公').length,analysis:rows.filter(x=>x.domain==='分析').length}}
function addTask(data){const t={id:next('T'),created:new Date().toLocaleTimeString('zh-CN'),status:'running',progress:0,billed:null,logs:[],...copy(data)};state.tasks.push(t);return t}
function runProcessing(preview=false){const input=current();if(!input||!state.plan)return toast('请先选择数据并生成计划');if(!can(input,'process'))return toast('该版本没有加工许可');const result=processRows(input.rows,state.plan);if(preview){modal('样例试跑 · 不产生版本或费用',`<div class="sample"><code>${esc(JSON.stringify(result.rows.slice(0,3),null,2))}</code></div><p class="sm muted" style="margin-top:12px">预估输出 ${result.rows.length} 条。配比最多抽取 10 条，类别不足不复制补齐。</p>`,`<button class="primary" data-action="close-modal">返回计划</button>`);return}const c=processingCost();const t=addTask({type:'processing',inputVersionId:input.id,licenseId:input.licenseId,estimate:c.total,plan:state.plan,feedbackEvalId:state.feedback?.evalId||null,logs:[`锁定 ${input.id} / ${input.version} 与许可 ${input.licenseId}`,`过滤 ${result.filtered} 条；去重 ${result.duplicates} 条；配比未选 ${result.unselected} 条`]});if(!result.rows.length){t.status='failed';t.billed=0;t.logs.push('输出为空，未生成新版本；模拟费用为 0');render();toast('处理失败：无可用样本。失败记录已进入任务中心');return}const n=state.versions.filter(v=>v.root===input.root&&v.parentId).length+1;const v=addVersion({name:input.name.replace(/ · 增强版$/,'')+' · 增强版',root:input.root,version:'1.'+n,parentId:input.id,taskId:t.id,licenseId:input.licenseId,origin:input.origin,rows:result.rows,stats:result,plan:state.plan,feedbackEvalId:t.feedbackEvalId});t.status='completed';t.progress=100;t.billed=c.total;t.outputVersionId=v.id;t.logs.push(`生成只读结果 ${v.id} / v${v.version}，源版本保持不变`);state.outputId=v.id;state.cloudVersionId=v.id;render();toast('已生成 '+v.id+'，加工任务和模拟费用已记录')}
function processingResult(){const v=output();if(!v)return `<h2>处理结果</h2><p class="muted sm">运行后生成新的只读版本，关联源数据、授权与处理任务。</p><div class="sample"><h3>输入样例</h3><code>${esc(JSON.stringify(current()?.rows[0]||{},null,2))}</code></div>`;const s=v.stats;return `<div class="section-title"><div><h2>新版本已生成</h2><span class="code-id">${v.id} · v${v.version} · ${v.taskId}</span></div><span class="tag green">只读快照</span></div><div class="mini-kpis"><div><b>${s.input}</b><small>输入条数</small></div><div><b>${v.rows.length}</b><small>输出条数</small></div><div><b>${s.office} / ${s.analysis}</b><small>办公 / 分析</small></div></div><p class="sm muted" style="margin-top:12px">过滤 ${s.filtered} 条 · 去重 ${s.duplicates} 条 · 配比未选 ${s.unselected} 条</p><div class="badge-row"><button class="small" data-version="${v.id}">版本与溯源</button><button class="small" data-license="${v.licenseId}">${lic(v.licenseId).name}</button><button class="small" data-task="${v.taskId}">任务记录</button></div><div class="actionline"><button data-download-version="${v.id}">下载 JSONL</button><button data-publish="${v.id}">发布商品</button><button class="primary" data-train-version="${v.id}">训练 / Agent →</button></div><p class="scope-text">${can(v,'train')?'允许内部训练':'不可用于训练'} · ${can(v,'resell')?'可在许可范围内衍生销售':'当前不能直接再销售'}</p>`}
function ancestors(v){const a=[],seen=new Set;while(v&&!seen.has(v.id)){a.unshift(v);seen.add(v.id);v=ver(v.parentId)}return a}
function lineage(v){return `<div class="lineage">${ancestors(v).map((x,i)=>`${i?`<div class="lineage-join">${x.taskId}<br>加工 →</div>`:''}<div class="lineage-node ${x.id===v.id?'current':''}"><span class="code-id">${x.id} · v${x.version}</span><strong>${esc(x.name)}</strong><span class="tiny muted">${x.rows.length} 条 · ${x.parentId?'衍生版本':'源版本'}</span><br><button class="small" data-version="${x.id}">查看版本</button></div>`).join('')}</div>`}
function versionModal(id){const v=ver(id);if(!v)return;const related=state.tasks.filter(t=>t.inputVersionId===v.id||t.outputVersionId===v.id),children=state.versions.filter(x=>x.parentId===v.id);modal('数据版本与溯源',`<div class="section-title"><div><h2>${esc(vname(v))}</h2><span class="code-id">${v.id}</span></div><span class="tag green">固定快照 · 不覆盖</span></div>${lineage(v)}<div class="notice">关联许可 ${v.licenseId} · ${esc(lic(v.licenseId).name)}。${can(v,'resell')?'可在授权范围内销售衍生商品。':'无衍生销售权，来源可追溯不代表可转售。'} <button class="small ghost" data-license="${v.licenseId}">查看授权</button></div>${v.feedbackEvalId?`<p class="sm" style="margin-top:14px">本次加工参考了 <button class="plain-link" data-task="${v.feedbackEvalId}">${v.feedbackEvalId} 的问题类型</button>，未加入独立评测题目。</p>`:''}<h3 style="margin-top:20px">关联任务</h3>${related.length?related.map(t=>`<div class="activity"><div><b>${typeName(t.type)} ${t.id}</b><div class="tiny muted">输入 ${t.inputVersionId} ${t.outputVersionId?'→ '+t.outputVersionId:''} ${t.outputModelId?'→ '+t.outputModelId:''}</div></div><button class="small" data-task="${t.id}">${statusName(t.status)} · 详情</button></div>`).join(''):'<p class="sm muted">尚无使用此版本的任务。</p>'}${children.length?`<h3 style="margin-top:18px">下游版本</h3><div class="badge-row">${children.map(x=>`<button class="small" data-version="${x.id}">${x.id} / v${x.version}</button>`).join('')}</div>`:''}<details><summary>查看数据样例与处理配方</summary><div class="sample" style="margin-top:10px"><code>${esc(JSON.stringify({sample:v.rows.slice(0,2),plan:v.plan||null},null,2))}</code></div></details>`,`<button data-download-version="${v.id}">下载数据</button><button data-publish="${v.id}">提交商品</button><button data-process-version="${v.id}">基于此版本加工</button><button class="primary" data-train-version="${v.id}">训练 / Agent</button>`)}
function official(){return `<section class="official-hero"><div class="eyebrow">官方精选 · 合作增值</div><h1>先约定授权，再加工和销售</h1><p class="muted">由真实采购需求发现候选商品。作者明确许可后，平台加工、专业质检并按约分账。</p><div class="license-step">${['需求信号','单独授权','加工与质检','衍生销售'].map((x,i)=>`<div class="${i===0||state.officialAccepted&&i===1?'done':''}">0${i+1}　${x}</div>`).join('')}</div></section><section class="panel"><div class="official-card"><div><span class="tag blue">第三方作者</span><h2 style="margin-top:12px">中文表格核对与分析任务</h2><p class="sm muted">最近 30 天：48 笔购买、9 家独立买方、18 次加工需求（均为示例）</p><p class="sm">补充难度分层、统一指令、专业抽检，并保留源版本与作者分成记录。</p></div><div class="right"><span class="tag ${state.officialAccepted?'green':'amber'}">${state.officialAccepted?'授权已记录 · 模拟':state.offer==='sent'?'待作者确认':'待合作'}</span><div style="margin-top:16px">${state.officialAccepted?'<button class="teal" data-action="official-process">带授权进入加工 →</button>':state.offer==='sent'?'<button class="teal" data-action="author-review">模拟作者查看并确认</button>':'<button class="primary" data-action="official-offer">发起授权采购</button>'}</div></div></div></section><div class="row section"><section class="panel"><h2>可讨论的合作条件</h2><div class="costline"><span>一次性授权费</span><b>¥3,000</b></div><div class="costline"><span>作者持续分成</span><b>净销售额 × 20%</b></div><div class="costline"><span>期限与范围</span><b>非独占 · 12 个月</b></div><p class="sm muted" style="margin-top:14px">作者保留原商品销售权。平台获约定的加工、内部训练与评测、衍生分销许可，不得原样转售。</p><p class="tiny muted">净销售额按实际成交价扣税款和退款，折扣不重复扣减；不扣运营和加工成本，不抵扣前期授权费。</p>${state.officialAccepted?`<button class="small" data-license="${ver(state.officialVersionId).licenseId}">查看授权记录与绑定版本</button>`:''}</section><section class="panel"><h2>商品与收益都可追溯</h2><p class="sm">源数据 → 加工任务 → 衍生版本 → 官方商品。每个发布版本独立关联许可和分成规则。</p><p class="sm muted">第三方样例展示不授予平台全量使用权。官方商品须完成专业质检；普通第三方加工只展示技术处理记录。</p><div class="notice">发布时明确授权方、范围、期限与来源。销售资格与来源记录分别审核。</div></section></div>`}
function acceptOfficial(){if(!$('#author-consent')?.checked)return toast('需由模拟作者确认授权范围');if(state.officialAccepted)return;const l=addLicense({name:'官方衍生销售许可',author:'示例表格任务作者',holder:'数作官方工作室',kind:'official',rights:{process:true,train:true,resell:true},evidence:'双方接受的衍生授权条款 · 模拟',royalty:20});const v=addVersion({name:'官方获授权表格任务',version:'1.0',root:'product-sheet',rows:makeRaw(),licenseId:l.id,origin:'official'});state.orders.push(freeze({id:next('O'),name:v.name,kind:'official',paid:3000,licenseId:l.id,versionId:v.id,productId:'sheet-official'}));state.offer='accepted';state.officialAccepted=true;state.officialVersionId=v.id;$('#modal').close();render();toast('已登记模拟采购订单、授权和源版本')}
function publishVersion(id){const v=ver(id);if(!v)return;if(!can(v,'resell'))return modal('当前许可不支持再销售',`<p>此版本未取得衍生销售许可。加工与溯源记录不会扩大商业使用范围。</p><button class="small" data-license="${v.licenseId}">查看原许可 ${v.licenseId}</button>`,`<button data-action="close-modal">返回</button><button class="primary" data-action="go-official">官方合作授权</button>`);if(state.published.some(p=>p.versionId===id))return toast('该版本已有发布记录，可加工新版本后再提交');state.publishingId=id;modal('发布固定版本商品',`<label class="field">商品名称</label><input id="pub-title" value="${esc(v.name)}"><div class="form-grid" style="margin-top:16px"><div><label class="field">非独占内部使用许可价格（元）</label><input id="pub-price" type="number" min="1" value="${v.origin==='official'?10000:2000}"></div><div><label class="field">固定交付版本</label><input readonly value="${v.id} / v${v.version}"></div></div><p class="sm muted" style="margin-top:15px">来源许可 ${v.licenseId}；买家获得内部使用许可，不获得再销售权。${lic(v.licenseId).royalty?'保留原作者署名，按净销售额记录 20% 分成。':'作者保留合法权利；平台抽佣示例 10%。'}</p><label class="checkline"><input id="pub-rights" type="checkbox">确认商业分销权及源材料证明与当前版本一致。</label>${(v.origin==='official'||v.origin==='trace')?'<label class="checkline"><input id="pub-qc" type="checkbox">模拟确认专业质检报告覆盖本版本。</label>':'<p class="tiny muted">提交后进入权利准入审核；第三方商品不自动获得官方专业质检标识。</p>'}`,`<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-publish">提交模拟发布</button>`)}
function confirmPublish(){const v=ver(state.publishingId);if(!v||!can(v,'resell'))return toast('无有效衍生销售许可');if(!$('#pub-rights')?.checked)return toast('请确认商业分销权与权利依据');if((v.origin==='official'||v.origin==='trace')&&!$('#pub-qc')?.checked)return toast('官方商品需完成本版本专业质检');const price=Number($('#pub-price').value),name=$('#pub-title').value.trim();if(!name||!Number.isFinite(price)||price<=0)return toast('请填写有效名称和价格');state.published.push(freeze({id:next('P'),name,price,versionId:v.id,licenseId:v.licenseId,royalty:lic(v.licenseId).royalty,status:v.origin==='official'?'已发布 · 模拟':'待准入审核 · 模拟'}));$('#modal').close();state.workspaceTab='versions';navigate('workspace');toast('发布记录已绑定固定版本与源授权')}
function cloudEstimate(){const agent=state.cloudMode==='agent',resource=agent?18:state.hours*state.gpus*12,service=agent?12:20,evaluation=agent?6:8;return {resource,service,evaluation,total:resource+service+evaluation}}
function evalSet(id){const e=evaluationSets.find(e=>e.id===id);if(e)return {...e,permitted:true};const v=ver(id);return v?{id:v.id,name:v.name,version:v.version,count:v.rows.length,root:v.root,permitted:can(v,'train')}:null}
function activeCloud(){return state.tasks.find(t=>t.status==='running'&&['training','agent','evaluation'].includes(t.type))}
function cloud(){const v=ver(state.cloudVersionId),c=cloudEstimate(),busy=!!activeCloud();return `<div class="page-head"><div class="eyebrow">模型与 Agent</div><div class="flex between wrap"><h1>训练有输入，评测有依据</h1><button class="small" data-worktab="tasks">任务中心 →</button></div><p class="muted">锁定数据版本、许可与独立评测集。构建和评测分别记录，结果始终对应原任务。</p></div><div class="cloud-layout"><section class="panel"><h2>选择目标</h2><div class="row"><button class="preset ${state.cloudMode==='sft'?'active':''}" data-mode="sft" ${busy?'disabled':''}><b>垂类模型微调</b><p>SFT / LoRA · 兼容 7B 示例模板</p></button><button class="preset ${state.cloudMode==='agent'?'active':''}" data-mode="agent" ${busy?'disabled':''}><b>知识库 Agent</b><p>RAG 与工具编排 · 不训练模型参数</p></button></div><hr><div class="form-grid"><div><label class="field" for="cloud-version">训练 / 应用数据</label><select id="cloud-version" ${busy?'disabled':''}>${state.versions.map(x=>`<option value="${x.id}" ${x.id===state.cloudVersionId?'selected':''}>${x.id} · ${esc(vname(x))}</option>`).join('')}</select><button class="plain-link tiny" style="margin-top:8px" data-license="${v?.licenseId}">查看输入授权 ${v?.licenseId||''}</button></div><div><label class="field" for="eval-set">独立评测集与固定版本</label><select id="eval-set" ${busy?'disabled':''}>${evaluationSets.map(e=>`<option value="${e.id}" ${state.evalSetId===e.id?'selected':''}>${e.name} v${e.version} · ${e.count} 条示例</option>`).join('')}<optgroup label="工作区数据（需独立来源）">${state.versions.map(x=>`<option value="${x.id}" ${state.evalSetId===x.id?'selected':''}>${x.id} · ${esc(vname(x))}</option>`).join('')}</optgroup></select><p class="field-desc">同一数据或同源衍生版本不可兼作评测集；正式版还需内容重合检查。</p></div><div><label class="field">基础模型 / 模板</label><input readonly value="${state.cloudMode==='sft'?'兼容 7B 模型 · LoRA 模板':'办公知识库 · 检索与表格工具'}"></div><div><label class="field" for="budget">构建 + 评测预算上限（元）</label><input type="number" id="budget" value="${state.budget}" min="1" ${busy?'disabled':''}></div>${state.cloudMode==='sft'?`<div><label class="field" for="hours">GPU 时长：<span id="hours-label">${state.hours}</span> 小时</label><input type="range" id="hours" value="${state.hours}" min="1" max="12" ${busy?'disabled':''}></div><div><label class="field" for="gpus">GPU 数量</label><select id="gpus" ${busy?'disabled':''}><option value="1" ${state.gpus===1?'selected':''}>1 张 · 示例规格</option><option value="2" ${state.gpus===2?'selected':''}>2 张 · 示例规格</option></select></div>`:''}</div><p class="tiny muted">资源提供方：云合作方 A（待接入）。当前只演示流程，不调用云服务。</p><div class="checks"><label class="checkline"><input id="training-rights" type="checkbox" ${state.cloudRights?'checked':''} ${busy?'disabled':''}>已核对数据与基础模型许可，以及资源方的处理范围。</label><label class="checkline"><input id="eval-separate" type="checkbox" ${state.evalConfirm?'checked':''} ${busy?'disabled':''}>确认独立评测集；构建完成后按本预算自动执行一次评测。</label></div><div id="cloud-error" class="error" role="alert"></div><div class="actionline"><button data-action="download-recipe">下载任务配置</button><button class="primary" data-action="start-cloud" ${busy?'disabled':''}>模拟构建并评测</button></div></section><div class="stack"><section class="panel"><h2>预算预估</h2><div id="cloud-price">${cloudPrice()}</div><p class="tiny muted">虚构单价。构建和评测分任务计费，不重复计算；正式服务按实际用量核对账单。</p></section><section class="panel" id="cloud-result">${cloudResult()}</section></div></div>`}
function cloudPrice(){const c=cloudEstimate();return `<div class="costline"><span>${state.cloudMode==='sft'?`${state.gpus} GPU × ${state.hours} 小时 × ¥12`:'模型调用 / 检索'}</span><b>${money(c.resource)}</b></div><div class="costline"><span>编排服务费</span><b>${money(c.service)}</b></div><div class="costline"><span>独立评测预算</span><b>${money(c.evaluation)}</b></div><div class="costline"><b>合计</b><b class="metric">${money(c.total)}</b></div>`}
function recipe(){const v=ver(state.cloudVersionId),e=evalSet(state.evalSetId);return {demo:true,mode:state.cloudMode,datasetId:v?.id,datasetVersion:v?.version,licenseId:v?.licenseId,evalSet:e,base:state.cloudMode==='sft'?'compatible-7b-lora':'office-rag-tools',provider:'待接入云合作方 A',hours:state.hours,gpus:state.gpus,budgetCap:state.budget,estimate:cloudEstimate(),notice:'仅示例配置，未启动真实资源'}}
function startCloud(){const error=s=>{$('#cloud-error').textContent=s;toast(s)};if(activeCloud())return error('请等待或取消当前演示任务');const v=ver(state.cloudVersionId),e=evalSet(state.evalSetId);if(!v||!can(v,'train'))return error('当前输入版本未获得训练与应用许可');if(!e||!e.permitted)return error('所选评测集没有相应使用许可');if(e.id===v.id||e.root===v.root)return error('训练数据及其同源衍生版本不能作为独立评测集');if(!state.cloudRights||!state.evalConfirm)return error('请确认授权范围及独立评测安排');const cfg=recipe();if(!Number.isFinite(cfg.budgetCap)||cfg.budgetCap<cfg.estimate.total)return error('预算上限低于构建与评测合计费用');const t=addTask({type:state.cloudMode==='sft'?'training':'agent',inputVersionId:v.id,licenseId:v.licenseId,estimate:cfg.estimate.resource+cfg.estimate.service,config:cfg,evalSetId:e.id,logs:[`输入锁定 ${v.id} / v${v.version}，许可 ${v.licenseId}`,`预留独立评测 ${e.id} / v${e.version}`]});state.lastCloudTaskId=t.id;$('#toast').classList.remove('show');render();simulate(t,()=>{const m=freeze({id:next('M'),name:t.type==='training'?'办公模型 LoRA · 示例':'办公知识 Agent · 示例',base:cfg.base,inputVersionId:v.id,licenseId:v.licenseId,taskId:t.id});state.models.push(m);t.outputModelId=m.id;const et=addTask({type:'evaluation',inputVersionId:v.id,licenseId:v.licenseId,inputModelId:m.id,parentTaskId:t.id,evalSetId:e.id,evalSnapshot:e,estimate:cfg.estimate.evaluation,config:cfg,logs:[`比较基线 ${cfg.base} 与产物 ${m.id}`,`评测集 ${e.id} / v${e.version}，${e.count} 条；示例不执行真实推理`]});t.evaluationTaskId=et.id;simulate(et,()=>{const baselinePassed=Math.round(e.count*.68),afterPassed=Math.round(e.count*.77);et.report=freeze({demo:true,evaluationTaskId:et.id,trainingTaskId:t.id,inputVersionId:v.id,inputVersion:v.version,licenseId:v.licenseId,modelId:m.id,baseline:cfg.base,evaluationSet:e,metrics:{sampleCount:e.count,baselinePassed,afterPassed,baselinePercent:Math.round(1000*baselinePassed/e.count)/10,afterPercent:Math.round(1000*afterPassed/e.count)/10},recommendation:'增加表格汇总边界与统计口径的训练样本，再检查重复数据。',notice:'全部指标为虚构演示，未训练、未评测真实模型；建议只回传问题类型，不回流评测题目和答案'});et.logs.push('已生成关联固定数据、模型与评测集的示例报告')})})}
function simulate(t,done){const timer=setInterval(()=>{if(t.status!=='running'){clearInterval(timer);timers.delete(t.id);return}t.progress+=25;t.logs.push(`本地状态模拟 ${t.progress}%`);if(t.progress>=100){t.progress=100;t.status='completed';t.billed=t.estimate;clearInterval(timer);timers.delete(t.id);done()}refreshTaskUI()},400);timers.set(t.id,timer)}
function refreshTaskUI(){if(state.page==='cloud'){$('#cloud-result').innerHTML=cloudResult();if(!activeCloud())render()}if(state.page==='workspace'&&state.workspaceTab==='tasks')render();if(state.modalTaskId&&$('#modal').open)taskModal(state.modalTaskId)}
function cancelTask(id){const t=task(id);if(!t||t.status!=='running')return;clearInterval(timers.get(id));timers.delete(id);t.status='canceled';t.billed=0;t.logs.push('演示已取消，未创建真实资源；本 Demo 取消费用为 0，正式按实际用量结算');if(t.type==='training'||t.type==='agent')t.logs.push('未创建下游评测任务');refreshTaskUI();toast('演示任务已取消')}
function cloudResult(){const t=task(state.lastCloudTaskId);if(!t)return '<span class="tag">尚未创建</span><h3 style="margin-top:12px">执行与评测记录</h3><p class="sm muted">构建产物关联输入版本；独立评测关联模型和固定评测集。可随时从任务中心找回历史报告。</p>';const e=task(t.evaluationTaskId),active=t.status==='running'?t:e?.status==='running'?e:null;let html=`<h3>最近任务 ${t.id}</h3><p class="tiny muted">输入 ${t.inputVersionId} · 许可 ${t.licenseId}<br>${esc(vname(ver(t.inputVersionId)))}</p>`;if(active)return html+statusBadge(active.status)+`<p class="sm" style="margin-top:10px">${typeName(active.type)} ${active.id}</p><div class="progress"><i style="width:${active.progress}%"></i></div><p class="tiny muted">本地状态模拟 · ${active.progress}%</p><div class="result-actions"><button class="small" data-task="${active.id}">任务详情</button><button class="small danger" data-cancel="${active.id}">取消任务</button></div>`;if(t.status==='canceled'||e?.status==='canceled')return html+`<span class="tag amber">${e?'评测':'构建'}已取消</span><p class="sm muted" style="margin-top:10px">${e?'构建产物仍保留，尚无完成的评测报告。':'未产生构建产物或评测报告。'}</p><button class="small" data-task="${e?.id||t.id}">查看任务记录</button>`;if(e?.report)return html+reportSummary(e);return html+statusBadge(t.status)}
function reportSummary(t){const r=t.report,m=r.metrics;return `<span class="tag green">独立评测完成 · 模拟</span><div class="task-summary"><b>产物 ${r.modelId}</b><div class="tiny muted">${r.evaluationSet.name} v${r.evaluationSet.version}<br>${r.evaluationSet.count} 条 · ${t.id}</div></div><div class="result-bars"><div class="bar-row"><span>基线</span><div class="bar"><i style="width:${m.baselinePercent}%"></i></div><b>${m.baselinePercent}%</b></div><div class="bar-row"><span>构建后</span><div class="bar"><i class="teal" style="width:${m.afterPercent}%"></i></div><b>${m.afterPercent}%</b></div></div><p class="tiny muted">虚构指标，仅展示报告结构；不表示实际效果提升。</p><div class="result-actions"><button class="small" data-task="${t.id}">报告关联</button><button class="small" data-report="${t.id}">下载报告</button><button class="small teal" data-feedback="${t.id}">带着问题继续加工 →</button></div>`}
function feedback(id){const t=task(id);if(!t?.report)return;state.feedback={evalId:id,text:t.report.recommendation};state.sourceId=t.inputVersionId;state.outputId=null;state.plan=null;state.instruction='过滤空问题和空答案，去重。';state.modalTaskId=null;if($('#modal').open)$('#modal').close();navigate('studio')}
function workspace(){return `<div class="page-head"><div class="eyebrow">资产与任务</div><div class="flex between wrap"><h1>从一份授权，找到每次加工与评测</h1><button class="small mobile-reset" data-action="reset">重置演示</button></div><p class="muted">版本、任务与订单分别记录，通过编号关联。所有记录仅保存在当前页面会话。</p></div><div class="grid4"><div class="metric-card"><label>数据版本</label><div class="metric">${state.versions.length}</div></div><div class="metric-card"><label>处理 / 构建 / 评测任务</label><div class="metric">${state.tasks.length}</div></div><div class="metric-card"><label>采购与授权订单</label><div class="metric">${state.orders.length}</div></div><div class="metric-card"><label>模拟任务费用 · 非真实支出</label><div class="metric">${money(state.tasks.reduce((n,t)=>n+(t.billed||0),0))}</div></div></div><div class="subnav workspace-tabs">${[['versions','数据版本'],['tasks','任务中心'],['licenses','授权与订单']].map(([k,n])=>`<button data-worktab="${k}" class="${state.workspaceTab===k?'active':''}">${n}</button>`).join('')}</div>${state.workspaceTab==='tasks'?taskCenter():state.workspaceTab==='licenses'?licensesPage():versionsPage()}`}
function versionsPage(){return `<section class="panel"><div class="section-title"><h2>数据与衍生版本</h2><button class="small" data-nav="studio">新增加工任务 →</button></div><div class="asset-list">${[...state.versions].reverse().map(v=>`<article class="asset-card"><div><div class="badge-row"><span class="tag ${v.parentId?'green':'blue'}">${v.parentId?'衍生版本':'源版本'}</span><span class="code-id">${v.id} / v${v.version}</span></div><h3 style="margin-top:9px">${esc(v.name)}</h3><div class="tiny muted">${v.rows.length} 条 · ${v.parentId?'来源 '+v.parentId+' / 任务 '+v.taskId:'原始登记快照'} · 授权 ${v.licenseId}</div><div class="scope-text">${can(v,'train')?'可内部训练':'不可训练'} · ${can(v,'resell')?'可按约衍生销售':'不可再销售'}</div></div><div class="flex"><button class="small" data-version="${v.id}">版本与溯源</button><button class="small" data-process-version="${v.id}">加工</button></div></article>`).join('')}</div></section>${state.published.length?`<section class="panel section"><h2>商品发布记录</h2>${state.published.map(p=>`<div class="activity"><div><b>${esc(p.name)}</b><div class="tiny muted">${p.id} · 固定版本 ${p.versionId} · 源许可 ${p.licenseId} · ${money(p.price)} ${p.royalty?'· 作者分成 '+p.royalty+'%':''}</div></div><div><span class="tag green">${p.status}</span><button class="small" data-version="${p.versionId}">查看版本</button></div></div>`).join('')}</section>`:''}${state.models.length?`<section class="panel section"><h2>模型与 Agent 产物 · 模拟</h2>${state.models.map(m=>`<div class="activity"><div><b>${esc(m.name)} · ${m.id}</b><div class="tiny muted">输入 ${m.inputVersionId} · 构建任务 ${m.taskId}</div></div><button class="small" data-task="${m.taskId}">构建与评测</button></div>`).join('')}</section>`:''}`}
function taskCenter(){const tasks=state.tasks.filter(t=>(state.taskType==='all'||t.type===state.taskType)&&(state.taskStatus==='all'||t.status===state.taskStatus));return `<section class="panel"><div class="section-title"><div><h2>统一任务中心</h2><p class="sm muted">每笔费用都对应一个任务；构建与评测各自保留输入、输出和日志。</p></div><span class="tag">${tasks.length} 条记录</span></div><div class="task-filter"><select id="task-type" aria-label="任务类型">${[['all','全部类型'],['processing','数据加工'],['training','模型训练'],['agent','Agent 构建'],['evaluation','独立评测'],['trace','轨迹打包']].map(([v,n])=>`<option value="${v}" ${state.taskType===v?'selected':''}>${n}</option>`).join('')}</select><select id="task-status" aria-label="任务状态">${[['all','全部状态'],['running','运行中'],['completed','已完成'],['failed','失败'],['canceled','已取消']].map(([v,n])=>`<option value="${v}" ${state.taskStatus===v?'selected':''}>${n}</option>`).join('')}</select></div>${tasks.length?`<div class="table-wrap"><table class="task-table"><thead><tr><th>任务</th><th>状态</th><th>关联输入 → 产物</th><th>模拟结算 / 预估</th><th></th></tr></thead><tbody>${[...tasks].reverse().map(t=>`<tr><td><b>${t.id}</b><div class="tiny muted">${typeName(t.type)} · ${t.created}</div></td><td>${statusBadge(t.status)}</td><td class="desc"><button class="plain-link" data-version="${t.inputVersionId}">${t.inputVersionId}</button> → ${t.outputVersionId||t.outputModelId||t.inputModelId||'待生成'}<div class="tiny muted">${t.evalSetId?'评测集 '+t.evalSetId+' · ':''}授权 ${t.licenseId}</div></td><td>${t.billed===null?'待结算':money(t.billed)} / ${money(t.estimate)}</td><td><button class="small" data-task="${t.id}">详情</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="task-empty">暂无符合筛选的任务。运行一次加工，记录会出现在这里。</div>'}</section>`}
function licensesPage(){return `<section class="panel"><h2>授权记录</h2>${state.licenses.map(l=>`<div class="activity"><div><b>${l.id} · ${esc(l.name)}</b><div class="tiny muted">${esc(l.author)} → ${esc(l.holder)} · ${l.royalty?'后续分成 '+l.royalty+'%':'用途按许可'}</div></div><button class="small" data-license="${l.id}">范围与版本</button></div>`).join('')}</section><section class="panel section"><h2>模拟采购订单</h2>${state.orders.length?state.orders.map(o=>`<div class="activity"><div><b>${o.id} · ${esc(o.name)}</b><div class="tiny muted">交付 ${o.versionId} · 授权 ${o.licenseId} · ${o.kind==='official'?'衍生销售合作':'商品许可采购'}</div></div><div class="flex"><b>${money(o.paid)}</b><button class="small" data-license="${o.licenseId}">授权详情</button></div></div>`).join(''):'<div class="task-empty">尚无模拟采购订单。<button class="small ghost" data-nav="market">去市场 →</button></div>'}<p class="tiny muted" style="margin-top:15px">采购价、任务服务费和作者收益分别记账。此处不代表付款、签约或到账。</p></section>`}
function taskModal(id){const t=task(id);if(!t)return;state.modalTaskId=id;const v=ver(t.inputVersionId);modal(typeName(t.type)+' · '+t.id,`<div class="flex between">${statusBadge(t.status)}<span class="tiny muted">${t.created} · 本地演示</span></div><div class="license-facts"><div><small>固定输入版本</small><b>${t.inputVersionId} / v${v.version}</b><button class="plain-link tiny" data-version="${v.id}">${esc(v.name)}</button></div><div><small>来源许可</small><b>${t.licenseId}</b><button class="plain-link tiny" data-license="${t.licenseId}">${esc(lic(t.licenseId).name)}</button></div><div><small>模拟结算 / 预估</small><b>${t.billed===null?'待结算':money(t.billed)} / ${money(t.estimate)}</b></div></div>${t.outputVersionId?`<p class="sm">加工产物：<button class="plain-link" data-version="${t.outputVersionId}">${t.outputVersionId} · 查看版本与来源</button></p>`:''}${t.outputModelId?`<p class="sm">构建产物：${t.outputModelId} · ${esc(model(t.outputModelId).name)}</p>`:''}${t.parentTaskId?`<p class="sm">上游构建：<button class="plain-link" data-task="${t.parentTaskId}">${t.parentTaskId}</button> · 模型 / Agent ${t.inputModelId}</p>`:''}${t.evaluationTaskId?`<p class="sm">下游独立评测：<button class="plain-link" data-task="${t.evaluationTaskId}">${t.evaluationTaskId}</button></p>`:''}${t.evalSetId?`<p class="sm muted">评测数据：${t.evalSetId} · v${t.config?.evalSet?.version||'1.0'} · ${t.config?.evalSet?.count||0} 条</p>`:''}${t.feedbackEvalId?`<p class="sm">参考问题来源：<button class="plain-link" data-task="${t.feedbackEvalId}">${t.feedbackEvalId}</button></p>`:''}${t.report?reportSummary(t):''}<details ${t.report?'':'open'}><summary>执行日志与处理配方</summary><ul class="log">${t.logs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${t.plan?`<div class="sample"><code>${esc(JSON.stringify(t.plan,null,2))}</code></div>`:''}</details>`,`<button data-action="close-modal">关闭</button><button data-download-task="${t.id}">下载任务记录</button>${t.status==='running'?`<button class="danger" data-cancel="${t.id}">取消演示任务</button>`:''}`)}
function enterVersion(id,destination){const v=ver(id);if(!v)return;state.modalTaskId=null;if($('#modal').open)$('#modal').close();if(destination==='cloud'){if(activeCloud())return toast('请先等待或取消当前构建与评测');state.cloudVersionId=id;state.cloudRights=false;state.evalConfirm=false;navigate('cloud')}else{state.sourceId=id;state.plan=null;state.outputId=null;state.feedback=null;navigate('studio')}}

buy=function(){tradeState();const before=state.orders.length;const r=verification(state.selectedProduct,state.purchaseType);const channel=$('#order-channel')?.value||'direct';tradeBuy();if(state.orders.length===before)return;const o=state.orders.at(-1);const platform=Math.round(o.paid*.1*100)/100,broker=channel==='broker'?Math.round(o.paid*.05*100)/100:0;state.fulfillment[o.id]={status:'delivered',report:r,deliveredVersionId:o.versionId,delivery:'文件下载',acceptanceDays:7,terms:'以报告覆盖范围与本订单约定验收；不符可申请复核，退款不自动通过',channel,fees:freeze({basis:o.paid,platform,broker,seller:Math.round((o.paid-platform-broker)*100)/100}),events:['模拟交付完成，待买方验收；无真实付款或资金托管'],evidence:null};render();toast('订单已关联验证报告、交付版本与分账；可在订单详情验收')};
function fulfillmentLabel(f){return ({delivered:'待验收 · 待结算',accepted:'已验收 · 模拟结算',disputed:'争议处理中 · 结算暂停',refunded:'已退款 · 模拟'})[f?.status]||'授权采购'}
function orderModal(id){tradeState();const o=orderById(id),f=state.fulfillment[id];if(!o||!f)return;state.currentOrderId=id;const actual=technicalStats(ver(o.versionId).rows),same=JSON.stringify(actual)===JSON.stringify(f.report.stats);modal('订单验收与售后 · '+id,`<div class="badge-row"><span class="tag blue">${fulfillmentLabel(f)}</span><span class="tag">${f.delivery}</span></div><h3 class="section">${esc(o.name)}</h3><p class="sm">交付 <button class="plain-link" data-version="${o.versionId}">${o.versionId}</button> · 许可 <button class="plain-link" data-license="${o.licenseId}">${o.licenseId}</button> · <button class="plain-link" data-verification="${f.report.id}">${f.report.id}</button></p><p class="sm">本地技术比对：${same?'交付样例与报告记录一致':'交付内容与报告不一致'}。专业准确性、隐私与权利范围需分别审核。</p><p class="tiny muted">验收窗口示例为交付后 ${f.acceptanceDays} 日；本 Demo 不模拟日历到期或自动结算。${esc(f.terms)}。</p><h3>订单分账预览 · 无实际转账</h3><div class="costline"><span>本订单实付基数</span><b>${money(f.fees.basis)}</b></div><div class="costline"><span>平台服务费 10%${f.status==='refunded'?' · 已冲回':''}</span><b>${money(f.status==='refunded'?0:f.fees.platform)}</b></div><div class="costline"><span>推广人佣金 ${f.channel==='broker'?'5%':'0%'} · 不属于平台收入</span><b>${money(f.status==='refunded'?0:f.fees.broker)}</b></div><div class="costline"><span>作者可结算 ${f.status==='accepted'?'· 模拟':'· 当前待处理'}</span><b>${f.status==='accepted'?money(f.fees.seller):'¥0'}</b></div><p class="tiny muted">${f.status==='refunded'?'本订单原分账已全部冲回':'应分给作者 '+money(f.fees.seller)}；仅按当前订单实付金额计算，试购抵扣不重复分账。退款时全额冲回本订单各方分账；税费、支付成本在正式合同中另计。</p>${f.evidence?`<p class="sm">争议说明：${esc(f.evidence)}</p>`:''}<ul class="log">${f.events.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${f.status==='refunded'?'<p class="sm muted">模拟许可停止新增使用；页面不具备撤回已下载文件的能力。</p>':''}`,`<button data-action="close-modal">关闭</button><button data-export-order="${id}">下载订单记录</button>${f.status==='delivered'?`<button class="primary" data-accept-order="${id}">模拟验收并结算</button>`:''}${['delivered','accepted'].includes(f.status)?`<button data-dispute-order="${id}">提交不符说明</button>`:''}${f.status==='disputed'?`<button data-refund-order="${id}">模拟审核通过并退款</button>`:''}`)}
function acceptOrder(id){const f=state.fulfillment?.[id];if(f?.status!=='delivered')return;const o=orderById(id);if(JSON.stringify(technicalStats(ver(o.versionId).rows))!==JSON.stringify(f.report.stats))return toast('交付内容与报告不一致，请提交复核');f.status='accepted';f.events.push('模拟买方验收；按已锁定比例确认分账，未发生转账');render();orderModal(id)}
function disputeOrder(id){const f=state.fulfillment?.[id];if(!['delivered','accepted'].includes(f?.status))return;state.currentOrderId=id;modal('提交报告不符说明',`<p class="sm">订单 ${id}，报告 ${f.report.id}。请说明与哪个验收字段或约定不符。专业效果不在技术报告覆盖范围内时，按另行约定处理。</p><label class="field" for="dispute-text">不符事项与证据摘要</label><textarea id="dispute-text" rows="4" placeholder="例如：交付字段缺失；附记录编号和复核方法。"></textarea><p class="tiny muted">这里仅保存本地说明，不向平台或卖家发送消息。</p>`,`<button data-action="close-modal">取消</button><button class="primary" data-action="save-dispute">记录争议</button>`)}
function saveDispute(){const f=state.fulfillment?.[state.currentOrderId],s=$('#dispute-text')?.value.trim();if(!s||s.length<5)return toast('请填写具体的不符事项');if(!['delivered','accepted'].includes(f?.status))return;f.status='disputed';f.evidence=s;f.events.push('已记录本地争议；模拟分账暂停，等待复核');render();orderModal(state.currentOrderId)}
function refundOrder(id){const f=state.fulfillment?.[id];if(f?.status!=='disputed')return;f.status='refunded';f.events.push('演示审核结果为退款：冲回当前订单全部分账；未退回真实资金');render();orderModal(id)}
function controlledModal(productId){tradeState();state.controlledProductId=productId;modal('受控交付需求 · 尚未开通',`<p class="sm">用于不希望原始文件下载到买方环境的合作。拟通过专门服务提供受控运行与导出审核；真实隔离效果须单独验证。</p><label class="field" for="controlled-purpose">预期用途</label><select id="controlled-purpose"><option>域内分析</option><option>域内训练</option></select><label class="field" for="controlled-output">希望导出的成果</label><input id="controlled-output" placeholder="例如：统计汇总或通过审核的模型产物"><label class="checkline"><input type="checkbox" id="controlled-confirm">理解这是需求记录，不代表受控环境已交付、已授权或已报价。</label>`,`<button data-action="close-modal">取消</button><button class="primary" data-action="save-controlled">保存本地需求</button>`)}
function saveControlled(){tradeState();if(!$('#controlled-confirm')?.checked||!$('#controlled-output')?.value.trim())return toast('请填写期望产物并确认交付状态');state.deliveryRequests.push(freeze({id:'D-'+String(state.deliveryRequests.length+1).padStart(3,'0'),productId:state.controlledProductId,purpose:$('#controlled-purpose').value,output:$('#controlled-output').value.trim(),status:'待方案与报价 · 未发送'}));$('#modal').close();state.workspaceTab='licenses';navigate('workspace')}
const tradeLicensesPage=licensesPage;
licensesPage=function(){tradeState();let first=tradeLicensesPage().split('<section class="panel section">')[0];return first+`<section class="panel section"><h2>订单交付与结算</h2>${state.orders.length?state.orders.map(o=>`<div class="activity"><div><b>${o.id} · ${esc(o.name)}</b><div class="tiny muted">${o.versionId} · ${o.licenseId} · ${fulfillmentLabel(state.fulfillment[o.id])}</div></div><div class="flex wrap"><b>${money(o.paid)}</b>${state.fulfillment[o.id]?`<button class="small" data-order="${o.id}">验收 / 售后</button>`:`<button class="small" data-license="${o.licenseId}">授权详情</button>`}</div></div>`).join(''):'<p class="sm muted">尚无订单，可在市场先查看验证报告。</p>'}<p class="tiny muted">所有订单和分账均为模拟。推广佣金、API 费用与作者收益分别记账。</p></section>${state.deliveryRequests.length?`<section class="panel section"><h2>受控交付需求</h2>${state.deliveryRequests.map(r=>`<div class="activity"><div><b>${r.id} · ${esc(r.purpose)}</b><div class="tiny muted">期望产物：${esc(r.output)} · ${esc(r.status)}</div></div><span class="tag">规划能力</span></div>`).join('')}</section>`:''}`};
const tradeMarket=market;
market=function(){return tradeMarket()+`<section class="panel section"><div class="section-title"><div><h3>已有数据，也可以直接加工</h3><p class="sm muted">登记来源与用途许可后使用 DataFlow；无需先在市场购买数据。</p></div><button class="small" data-action="publish-source">导入自己的数据 →</button></div><p class="tiny muted">借鉴先验证、再交付和按订单结算。我们的重点是专业任务数据、可复用加工与训练评测。</p></section>`};
const tradeLicenseModal=licenseModal;
licenseModal=function(id){tradeLicenseModal(id);if(isLicenseSuspended(id))$('#modal .modalbody').insertAdjacentHTML('afterbegin','<p class="notice amber">关联订单已模拟退款，本许可停止新增使用；历史记录仍保留。</p>')};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.downloadVersion&&isLicenseSuspended(ver(d.downloadVersion)?.licenseId)){e.preventDefault();e.stopImmediatePropagation();toast('关联许可已模拟退款，不能新增下载或使用')}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.verification){state.modalTaskId=null;verificationModal(d.verification)}if(d.downloadVerification){download(d.downloadVerification+'.json',JSON.stringify(state.verifications[d.downloadVerification],null,2))}if(d.returnProduct){state.selectedProduct=d.returnProduct;state.purchaseType=d.returnKind;productModal()}if(d.order){state.modalTaskId=null;orderModal(d.order)}if(d.acceptOrder)acceptOrder(d.acceptOrder);if(d.disputeOrder)disputeOrder(d.disputeOrder);if(d.refundOrder)refundOrder(d.refundOrder);if(d.exportOrder)download(d.exportOrder+'-fulfillment.json',JSON.stringify({demo:true,order:orderById(d.exportOrder),fulfillment:state.fulfillment[d.exportOrder]},null,2));if(d.controlled)controlledModal(d.controlled);if(d.action==='save-dispute')saveDispute();if(d.action==='save-controlled')saveControlled()});
render();

</script></body></html>
